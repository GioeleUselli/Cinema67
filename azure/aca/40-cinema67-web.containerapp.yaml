# Cinema67 Frontend Container App YAML
# Deploy: az containerapp create --yaml azure/aca/40-cinema67-web.containerapp.yaml -g cinema67-rg
type: Microsoft.App/containerApps
location: italynorth
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/8c2facbb-2cc6-4a52-80f0-16310eeb0b70/resourceGroups/cinema67-rg/providers/Microsoft.App/managedEnvironments/cinema67-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: Auto
    registries:
      - server: cinema67acr.azurecr.io
        identity: system
  template:
    containers:
      - name: cinema67-web
        image: cinema67acr.azurecr.io/cinema67-web:latest
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: Production
          - name: API_BASE_URL
            value: https://api.cinema67.it
          - name: MEDIA_BASE_URL
            value: https://api.cinema67.it
          - name: DEPLOYMENT_MODE
            value: production
        resources:
          cpu: !!float 1.0
          memory: 2.0Gi
    scale:
      minReplicas: 1
      maxReplicas: 3
