# ============================================================================
# Nginx Configuration for Cinema67.Web
# ============================================================================
# Serves static files from /var/www/cinebase
# Proxies /api/* requests to upstream FilmAPI backend
# Implements security headers, rate limiting, gzip compression
# Handles SPA routing (try_files for Angular/React)
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript
        application/x-javascript 
        application/xml+rss
        application/json
        application/javascript;

    # Rate limiting zones
    # general: 10 requests/second
    # login: 5 requests/minute
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Upstream backend (variable from docker-compose env or Azure internal DNS)
    upstream filmapi {
        # Will be replaced by environment variable in docker-compose
        # Local: filmapi:5000
        # Azure: filmapi-app.internal.cinema67.azurecontainer.io:8080
        server ${FILMAPI_UPSTREAM};
    }

    server {
        listen 80 default_server;
        server_name _;
        
        charset utf-8;

        # ════════════════════════════════════════════════════════════════
        # Security Headers
        # ════════════════════════════════════════════════════════════════
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # HSTS for HTTPS (commented for HTTP-only, enable in production)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ════════════════════════════════════════════════════════════════
        # Health Check Endpoint
        # ════════════════════════════════════════════════════════════════
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # ════════════════════════════════════════════════════════════════
        # API Reverse Proxy
        # ════════════════════════════════════════════════════════════════
        location /api/ {
            # Rate limiting: general zone (10r/s, burst 20)
            limit_req zone=general burst=20 nodelay;

            # Proxy configuration
            proxy_pass http://filmapi;
            proxy_http_version 1.1;

            # Headers forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Special handling for login endpoint (stricter rate limit)
            location /api/auth/login {
                limit_req zone=login burst=2 nodelay;
                proxy_pass http://filmapi;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }

        # ════════════════════════════════════════════════════════════════
        # Static Files (Caching)
        # ════════════════════════════════════════════════════════════════
        location ~* /dist/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/cinebase;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header ETag "";
            if_modified_since off;
        }

        # ════════════════════════════════════════════════════════════════
        # SPA Routing (Angular/React fallback)
        # ════════════════════════════════════════════════════════════════
        location / {
            root /var/www/cinebase;
            try_files $uri $uri/ /index.html;
            
            # Don't cache HTML files
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ════════════════════════════════════════════════════════════════
        # Deny access to sensitive files
        # ════════════════════════════════════════════════════════════════
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
