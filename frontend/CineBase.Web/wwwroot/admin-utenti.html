<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 - Gestione Utenti</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js?v=99"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  </head>
<body class="cine-velvet bg-brand-surface text-brand-on-surface font-sans">
  <div id="navbar-container"></div>
  <main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">
    <section class="cine-premium-card p-5 sm:p-8 relative overflow-hidden cine-curtain-in mb-8">
      <div class="absolute -top-20 -right-20 w-64 h-64 rounded-full blur-3xl bg-brand-red/5"></div>
      <div class="absolute -bottom-20 -left-20 w-64 h-64 rounded-full blur-3xl bg-brand-gold/5"></div>
      <div class="relative z-10">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p class="cine-kicker">HR desk</p>
            <h1 class="cine-headline text-brand-on-surface">Gestione Account Utenti</h1>
            <p class="mt-2 text-sm text-brand-on-surface-variant">Crea account staff, modifica ruoli e assegna utenti ai cinema.</p>
          </div>
          <button onclick="openCreateModal()" class="btn-gold text-white px-4 py-2 rounded-lg text-sm font-medium">
            <i class="fa-solid fa-user-plus mr-2"></i>Nuovo Account
          </button>
        </div>
      </div>
    </section>

    <section class="cine-admin-slab mb-4 p-4">
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-3 items-end">
        <input id="filter-search" type="text" class="ghost-input w-full px-3 py-2" placeholder="Cerca nome, cognome o email...">
        <select id="filter-role" class="ghost-input w-full px-3 py-2"><option value="">Tutti i ruoli</option><option value="User">User</option><option value="PowerUser">PowerUser</option><option value="Admin">Admin</option><option value="Corriere">Corriere</option><option value="Magazziniere">Magazziniere</option><option value="CinemaStaff">Cinema Staff</option></select>
        <div class="flex gap-2">
          <button id="btn-prev" class="btn-outline-brand px-3 py-2 text-xs">&lt;</button>
          <span id="page-indicator" class="text-sm text-brand-on-surface-variant self-center">Pag 1 di 1</span>
          <button id="btn-next" class="btn-outline-brand px-3 py-2 text-xs">&gt;</button>
        </div>
      </div>
    </section>

    <section class="cine-admin-slab overflow-x-auto">
      <table class="min-w-full divide-y divide-brand-outline-variant/10">
        <thead class="bg-brand-surface-container">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Utente</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Ruolo</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Cinema Assegnato</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Data Registrazione</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Azioni</th>
          </tr>
        </thead>
        <tbody id="utenti-table-body" class="divide-y divide-brand-outline-variant/10">
          <tr><td colspan="5" class="px-6 py-4 text-center text-brand-on-surface-variant">Caricamento...</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <div id="user-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-gray-500/75"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-xl bg-brand-surface-container-lowest text-left shadow-xl sm:my-8 sm:w-full sm:max-w-md">
          <div class="px-6 pt-6 pb-4 flex justify-between"><h3 class="text-lg font-bold" id="modal-title">Nuovo Account</h3><button class="text-brand-on-surface-variant" onclick="closeModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
          <div class="px-6 pb-4"><form id="user-form" class="space-y-3">
            <div><label class="block text-sm mb-1">Nome</label><input name="nome" required class="ghost-input w-full px-3 py-2"></div>
            <div><label class="block text-sm mb-1">Cognome</label><input name="cognome" required class="ghost-input w-full px-3 py-2"></div>
            <div><label class="block text-sm mb-1">Email</label><input name="email" type="email" required class="ghost-input w-full px-3 py-2"></div>
            <div><label class="block text-sm mb-1">Password</label><input name="password" type="password" minlength="8" required class="ghost-input w-full px-3 py-2" placeholder="Minimo 8 caratteri"></div>
            <div><label class="block text-sm mb-1">Telefono</label><input name="telefono" class="ghost-input w-full px-3 py-2"></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="block text-sm mb-1">Ruolo</label><select name="ruolo" class="ghost-input w-full px-3 py-2"><option value="User">User (base)</option><option value="PowerUser">PowerUser (staff)</option><option value="Admin">Admin</option><option value="Corriere">Corriere</option><option value="Magazziniere">Magazziniere</option><option value="CinemaStaff">Cinema Staff</option></select></div>
              <div><label class="block text-sm mb-1">Cinema</label><select name="cinemaId" class="ghost-input w-full px-3 py-2"><option value="">Nessuno</option></select></div>
            </div>
          </form></div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button onclick="closeModal()" class="btn-outline-brand px-4 py-2 rounded-lg text-sm">Annulla</button>
            <button id="modal-submit" class="btn-gold px-4 py-2 rounded-lg text-sm">Crea Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js?v=99"></script>
  <script src="/js/api-app.js?v=7"></script>
  <script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
  <script src="/js/template-loader.js?v=101"></script>
  <script src="/js/admin-panel.js?v=6"
  <script src="/js/admin-shell.js?v=100"></script>
  <script src="/js/staff-shell.js?v=1"></script>></script>
  <script src="/js/pages/admin-utenti.js?v=999"></script>
</body>
</html>
