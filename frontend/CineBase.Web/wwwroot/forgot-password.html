<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 - Password Dimenticata</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js?v=99"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=1778149125" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  <script src="/js/route-guard.js?v=99"></script>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>
  <div class="flex-1 px-4 py-20">
    <div class="mx-auto max-w-md">
      <div class="cine-auth-shell p-8 rounded-2xl border border-brand-outline-variant/20">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold mb-2">Password dimenticata?</h1>
          <p class="text-sm text-brand-on-surface-variant">Inserisci la tua email e ti invieremo un link per reimpostarla.</p>
        </div>
        <div id="msg" class="hidden px-4 py-3 rounded-xl mb-4 text-sm"></div>
        <form id="forgot-form" class="space-y-4">
          <div><label for="email" class="block text-sm mb-2">Email</label><input type="email" id="email" class="ghost-input w-full px-4 py-3 rounded-xl" placeholder="nome@esempio.com" required></div>
          <button type="submit" class="btn-gold w-full py-3 rounded-xl"><span id="btn-text">Invia link reset</span><span id="btn-loader" class="hidden"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Invio...</span></button>
        </form>
        <div class="text-center mt-6"><a href="/login.html" class="text-sm text-brand-on-surface-variant hover:text-brand-gold"><i class="fa-solid fa-arrow-left mr-1"></i>Torna al login</a></div>
      </div>
    </div>
  </div>
  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>
  <script src="/js/utils.js?v=99"></script>
  <script src="/js/api-app.js?v=99"></script>
  <script src="/js/auth.js?v=99"></script>
  <script src="/js/template-loader.js?v=99"></script>
  <script src="/js/navbar.js?v=99"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async function(e){
      e.preventDefault();
      var btn = document.getElementById('btn-text');
      var loader = document.getElementById('btn-loader');
      var msg = document.getElementById('msg');
      btn.classList.add('hidden'); loader.classList.remove('hidden');
      try{
        var res = await API.forgotPassword({ email: document.getElementById('email').value });
        msg.className = 'bg-emerald-500/15 border border-emerald-500/30 text-emerald-500 px-4 py-3 rounded-xl mb-4 text-sm';
        msg.textContent = res.message || 'Controlla la tua email.';
        msg.classList.remove('hidden');
        document.getElementById('email').value = '';
      } catch(err) {
        msg.className = 'bg-brand-error-container border border-brand-error/30 text-brand-error px-4 py-3 rounded-xl mb-4 text-sm';
        msg.textContent = err.message || 'Errore';
        msg.classList.remove('hidden');
      }
      btn.classList.remove('hidden'); loader.classList.add('hidden');
    });
  </script>
</body>
</html>
