<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 - Ricarica Credito</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  <script src="/js/route-guard.js?v=99"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans">
  <div id="navbar-container"></div>

  <main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">
    <section class="cine-grid-shell mb-8 p-5 sm:p-6">
      <p class="cine-kicker">Credito operativo</p>
      <h1 class="cine-headline text-brand-on-surface">Ricarica Credito</h1>
      <p class="mt-2 text-sm text-brand-on-surface-variant">Console di supporto per ricerca utenti e movimentazione wallet piattaforma.</p>
    </section>

    <!-- User Search -->
    <div class="cine-admin-slab mb-6 p-4">
      <div class="relative">
        <input id="user-search-input" type="text" placeholder="Cerca utente per nome, cognome o email..." class="ghost-input w-full px-4 py-2 pl-10">
        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant"></i>
      </div>
    </div>

    <!-- All Users List -->
    <div class="cine-admin-slab overflow-x-auto mb-6">
      <div class="px-6 py-4 border-b border-brand-outline-variant/10 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-brand-on-surface">Utenti</h2>
        <span id="users-count" class="cine-admin-chip">0</span>
      </div>
      <table class="min-w-full divide-y divide-brand-outline-variant/10">
        <thead class="bg-brand-surface-container">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Nome</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Email</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Saldo</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Azioni</th>
          </tr>
        </thead>
        <tbody id="all-users-list" class="divide-y divide-brand-outline-variant/10">
          <tr><td colspan="4" class="px-6 py-4 text-center text-brand-on-surface-variant">Caricamento...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Selected User Panel -->
    <div id="selected-user-panel" class="hidden">
      <div class="cine-admin-slab p-6 mb-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <h2 class="text-lg font-semibold text-brand-on-surface" id="selected-user-name">-</h2>
            <p class="text-sm text-brand-on-surface-variant" id="selected-user-email">-</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-brand-on-surface-variant">Saldo Attuale</p>
            <p class="text-3xl font-bold text-brand-gold" id="selected-user-saldo">&euro;0.00</p>
          </div>
        </div>
      </div>

      <!-- Top-Up Form -->
      <div class="cine-admin-slab p-6 mb-6">
        <h3 class="text-md font-semibold text-brand-on-surface mb-4">Nuova Ricarica</h3>
        <form id="ricarica-form" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-1 gap-4">
            <div>
              <label for="ricarica-importo" class="block text-sm font-medium text-brand-on-surface mb-1">Importo (&euro;)</label>
              <input id="ricarica-importo" name="importo" type="number" step="0.01" min="0.01" required class="ghost-input w-full px-4 py-2" placeholder="10.00" title="Importo ricarica">
            </div>
          </div>
          <div>
            <label for="ricarica-note" class="block text-sm font-medium text-brand-on-surface mb-1">Note (opzionale)</label>
            <input id="ricarica-note" name="note" type="text" maxlength="500" class="ghost-input w-full px-4 py-2" placeholder="Note sulla ricarica" title="Note">
          </div>
          <button type="submit" class="btn-gold px-6 py-2 rounded-lg text-sm font-medium">
            <i class="fa-solid fa-coins mr-2"></i>Ricarica Credito
          </button>
        </form>
      </div>
    </div>

    <!-- Ricariche History -->
    <div class="cine-admin-slab overflow-x-auto" id="history-section">
      <div class="px-6 py-4 border-b border-brand-outline-variant/10">
        <h2 class="text-lg font-semibold text-brand-on-surface">Storico Ricariche Recenti</h2>
      </div>
      <table class="min-w-full divide-y divide-brand-outline-variant/10">
        <thead class="bg-brand-surface-container">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Data</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Utente</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Importo</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Operatore</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Note</th>
          </tr>
        </thead>
        <tbody id="history-table-body" class="divide-y divide-brand-outline-variant/10">
          <tr>
            <td colspan="5" class="px-6 py-4 text-center text-brand-on-surface-variant">Caricamento...</td>
            <td style="display:none"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <script src="/js/utils.js?v=99"></script>
  <script src="/js/api-app.js?v=99"></script>
  <script src="/js/auth.js?v=99"></script>
  <script src="/js/template-loader.js?v=99"></script>
  <script src="/js/admin-shell.js?v=1778077213"></script>
  <script src="/js/form-handlers.js"></script>
  <script src="/js/navbar.js?v=99"></script>
  <script src="/js/pages/ricarica-credito.js?v=99"></script>
</body>

</html>
