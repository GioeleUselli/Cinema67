<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 — Conferma Ordine Shop</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  <script src="/js/route-guard.js?v=102"></script>
  <style>::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--brand-gold);border-radius:999px}</style>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans cine-velvet min-h-screen">
<div id="navbar-container"></div>
<main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">
  <div id="loading-state" class="text-center py-16"><i class="fa-solid fa-spinner fa-spin text-4xl mb-4 text-brand-gold"></i><p class="text-brand-on-surface-variant">Verifica pagamento...</p></div>

  <div id="success-state" class="hidden text-center">
    <div class="cine-premium-card p-8 max-w-lg mx-auto">
      <i class="fa-solid fa-circle-check text-5xl text-green-400 mb-4"></i>
      <h2 class="text-2xl font-serif font-bold text-brand-on-surface mb-2">Ordine Confermato!</h2>
      <p class="text-sm text-brand-on-surface-variant mb-6">Grazie per il tuo acquisto. Riceverai i dettagli via email.</p>
      <div class="text-left space-y-2 mb-6" id="success-items"></div>
      <div class="border-t border-brand-outline-variant/20 pt-3 space-y-1 text-sm">
        <div class="flex justify-between"><span class="text-brand-on-surface-variant">Codice</span><span id="success-code" class="font-mono text-brand-gold"></span></div>
        <div class="flex justify-between"><span class="text-brand-on-surface-variant">Carta</span><span id="success-carta"></span></div>
        <div class="flex justify-between"><span class="text-brand-on-surface-variant">Credito</span><span id="success-credito"></span></div>
        <div class="flex justify-between font-bold"><span>Totale</span><span id="success-total" class="text-brand-gold font-serif"></span></div>
      </div>
      <a id="tracking-link" href="#" class="btn-outline-brand text-sm px-6 py-2 mb-2 block text-center"><i class="fa-solid fa-box mr-1"></i>Traccia Spedizione</a>
      <a href="/shop.html" class="btn-gold text-sm px-6 py-2">Torna allo Shop</a>
    </div>
  </div>

  <div id="error-state" class="hidden text-center py-16">
    <i class="fa-solid fa-circle-exclamation text-6xl text-brand-error mb-4"></i>
    <h3 class="text-xl font-semibold mb-2">Pagamento non riuscito</h3>
    <p class="text-brand-on-surface-variant mb-4" id="error-message"></p>
    <a href="/shop.html" class="btn-outline-brand">Torna allo Shop</a>
  </div>
</main>
<div id="footer-container"></div>

<script src="/js/utils.js?v=99"></script>
<script src="/js/api-app.js?v=102"></script>
<script src="/js/auth.js?v=100"></script>
<script src="/js/template-loader.js?v=101"></script>
<script src="/js/navbar.js?v=100"></script>
<script>
var orderId=parseInt(new URLSearchParams(window.location.search).get('orderId')||'0');

function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

async function checkOrder(){
  if(!orderId){showError('ID ordine mancante.');return;}
  try{
    var status=await API.getMerchCheckoutStatus(orderId);
    if(status.stato==='Paid'){renderSuccess(status.ordine);return;}
    if(status.stato==='Pending'||status.stato==='CheckoutInProgress'){
      try{await API.reconcileMerchCheckoutSession(orderId);}catch(e){}
      var status2=await API.getMerchCheckoutStatus(orderId);
      if(status2.stato==='Paid'){renderSuccess(status2.ordine);return;}
      if(status2.stato==='Pending'||status2.stato==='CheckoutInProgress'){
        document.getElementById('loading-state').querySelector('p').textContent='In attesa del pagamento...';
        setTimeout(checkOrder,3000);
        return;
      }
      showError('Pagamento non completato. Stato: '+status2.stato);
      return;
    }
    showError('Pagamento non completato. Stato: '+status.stato);
  }catch(e){showError('Errore verifica pagamento: '+(e.message||''));}
}

function renderSuccess(order){
  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('success-state').classList.remove('hidden');
  document.getElementById('success-code').textContent=order.codiceOrdine||'';
  document.getElementById('success-carta').textContent='€'+(order.importoCarta||0).toFixed(2);
  document.getElementById('success-credito').textContent='€'+(order.importoCredito||0).toFixed(2);
  document.getElementById('success-total').textContent='€'+order.totale.toFixed(2);
  document.getElementById('success-items').innerHTML=(order.items||[]).map(function(i){
    return '<div class="flex justify-between text-xs"><span class="text-brand-on-surface">'+escapeHtml(i.nome)+' &times; '+i.quantita+'</span><span>€'+i.subTotale.toFixed(2)+'</span></div>';
  }).join('');
  document.getElementById('tracking-link').href='/tracking-merch.html?orderId='+order.id;
}

function showError(msg){
  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('error-state').classList.remove('hidden');
  document.getElementById('error-message').textContent=msg;
}

document.addEventListener('DOMContentLoaded',checkOrder);
</script>
</body>
</html>
