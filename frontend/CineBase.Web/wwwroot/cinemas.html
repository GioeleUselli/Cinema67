<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 - Gestione Cinema</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  </head>

<body class="bg-brand-surface text-brand-on-surface font-sans cine-velvet">
  <div id="navbar-container"></div>

  <main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">
    <section class="cine-premium-card p-6 sm:p-8 relative overflow-hidden cine-reveal mb-8">
      <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-gradient-to-br from-brand-gold/25 to-brand-gold/5 blur-3xl"></div>
      <div class="absolute -bottom-32 -left-32 w-80 h-80 rounded-full bg-gradient-to-tr from-amber-600/20 to-transparent blur-3xl"></div>
      <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between relative z-10">
        <div>
          <p class="cine-kicker">Cinema network</p>
          <h1 class="cine-headline text-brand-on-surface">Gestione Cinema</h1>
          <p class="mt-2 text-sm text-brand-on-surface-variant">Controlla sedi, indirizzi e punti operativi della rete Cinema67.</p>
        </div>
        <button onclick="openModal('cinema-modal', 'Aggiungi Cinema')" class="btn-gold text-white px-4 py-2 rounded-lg text-sm font-medium">
          <i class="fa-solid fa-plus mr-2"></i>Aggiungi Cinema
        </button>
      </div>
    </section>

    <section class="cine-reveal cine-reveal-delay-1 mb-8 grid grid-cols-1 gap-4 md:grid-cols-3">
      <article class="cine-premium-card p-5 md:col-span-1 relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-32 h-32 rounded-full bg-gradient-to-br from-brand-gold/15 to-brand-gold/5 blur-2xl"></div>
        <div class="relative z-10">
          <p class="cine-kicker text-xs">Cinema Totali</p>
          <div class="flex items-end justify-between mt-2">
            <p class="text-3xl font-bold text-brand-on-surface" id="total-cinemas">0</p>
            <span class="inline-flex h-11 w-11 items-center justify-center rounded-full bg-brand-gold text-white"><i class="fa-solid fa-building"></i></span>
          </div>
        </div>
      </article>
      <article class="cine-premium-card p-5 md:col-span-2 relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-32 h-32 rounded-full bg-gradient-to-br from-brand-gold/10 to-transparent blur-2xl"></div>
        <div class="relative z-10">
          <div class="relative">
            <input type="text" id="search-input" title="Cerca cinema" placeholder="Cerca cinema per nome, città o indirizzo..." class="ghost-input w-full px-4 py-2.5 pl-10">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant"></i>
          </div>
        </div>
      </article>
    </section>

    <section class="cine-premium-card overflow-x-auto cine-reveal cine-reveal-delay-2 relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-64 h-64 rounded-full bg-gradient-to-br from-brand-gold/10 to-brand-gold/5 blur-3xl"></div>
      <div class="relative z-10">
        <table class="min-w-full divide-y divide-brand-outline-variant/10">
          <thead class="bg-brand-surface-container">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium label-caps">ID</th>
              <th class="px-6 py-3 text-left text-xs font-medium label-caps">Nome</th>
              <th class="px-6 py-3 text-left text-xs font-medium label-caps">Indirizzo</th>
              <th class="px-6 py-3 text-left text-xs font-medium label-caps">Città</th>
              <th class="px-6 py-3 text-left text-xs font-medium label-caps">Azioni</th>
            </tr>
          </thead>
          <tbody id="cinemas-table-body" class="divide-y divide-brand-outline-variant/10">
            <tr>
              <td colspan="5" class="px-6 py-4 text-center text-brand-on-surface-variant">Caricamento...</td>
            </tr>
          </tbody>
        </table>
        <div
          class="px-6 py-4 border-t border-brand-outline-variant/10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <p id="pagination-info" class="text-sm text-brand-on-surface-variant">Caricamento...</p>
          <div class="flex items-center gap-2">
            <button id="pagination-first" onclick="goToFirstPage()" type="button" title="Prima pagina"
              aria-label="Vai alla prima pagina"
              class="px-3 py-1.5 border border-brand-outline-variant rounded-lg text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-solid fa-angles-left"></i>
            </button>
            <button id="pagination-prev" onclick="goToPrevPage()" type="button" title="Pagina precedente"
              aria-label="Vai alla pagina precedente"
              class="px-3 py-1.5 border border-brand-outline-variant rounded-lg text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span id="page-indicator" class="text-sm text-brand-on-surface px-2">Pagina 1 di 1</span>
            <button id="pagination-next" onclick="goToNextPage()" type="button" title="Pagina successiva"
              aria-label="Vai alla pagina successiva"
              class="px-3 py-1.5 border border-brand-outline-variant rounded-lg text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button id="pagination-last" onclick="goToLastPage()" type="button" title="Ultima pagina"
              aria-label="Vai all'ultima pagina"
              class="px-3 py-1.5 border border-brand-outline-variant rounded-lg text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-solid fa-angles-right"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <!-- Modal -->
  <div id="cinema-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-gray-500/75 modal-backdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div
          class="relative transform overflow-hidden rounded-xl bg-brand-surface-container-lowest text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
          <div class="bg-brand-surface-container-lowest px-6 pt-6 pb-4">
            <h3 class="text-lg font-bold text-brand-on-surface" id="modal-title">Aggiungi Cinema</h3>
            <button type="button"
              class="absolute top-4 right-4 text-brand-on-surface-variant hover:text-brand-on-surface"
              onclick="closeModal('cinema-modal')" title="Chiudi" aria-label="Chiudi modal">
              <i class="fa-solid fa-xmark text-xl"></i>
            </button>
          </div>
          <div class="bg-brand-surface-container-lowest px-6 pb-4">
            <form id="cinema-form" class="space-y-4">
              <input type="hidden" name="id" value="">
              <div>
                <label for="cinema-nome" class="block text-sm font-medium text-brand-on-surface mb-1">Nome</label>
                <input id="cinema-nome" type="text" name="nome" required class="ghost-input w-full px-4 py-2"
                  title="Nome del cinema">
              </div>
              <div>
                <label for="cinema-indirizzo"
                  class="block text-sm font-medium text-brand-on-surface mb-1">Indirizzo</label>
                <input id="cinema-indirizzo" type="text" name="indirizzo" class="ghost-input w-full px-4 py-2"
                  title="Indirizzo del cinema">
              </div>
              <div>
                <label for="cinema-citta" class="block text-sm font-medium text-brand-on-surface mb-1">Città</label>
                <input id="cinema-citta" type="text" name="citta" class="ghost-input w-full px-4 py-2"
                  title="Città del cinema">
              </div>
            </form>
          </div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button type="button" class="btn-outline-brand px-4 py-2 rounded-lg text-sm font-medium"
              onclick="closeModal('cinema-modal')">Annulla</button>
            <button type="submit" form="cinema-form" class="btn-gold">Salva</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="delete-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-gray-500/75 modal-backdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div
          class="relative transform overflow-hidden rounded-xl bg-brand-surface-container-lowest text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md">
          <div class="bg-brand-surface-container-lowest px-6 pt-6 pb-4">
            <div class="flex items-center gap-4">
              <div
                class="flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-brand-error-container">
                <i class="fa-solid fa-triangle-exclamation text-red-600 text-xl"></i>
              </div>
              <div>
                <h3 class="text-lg font-bold text-brand-on-surface">Conferma Eliminazione</h3>
                <p class="text-sm text-brand-on-surface-variant mt-1" id="delete-message">Sei sicuro di voler eliminare
                  questo elemento?</p>
              </div>
            </div>
          </div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button type="button" class="btn-outline-brand px-4 py-2 rounded-lg text-sm font-medium"
              onclick="closeDeleteModal()">Annulla</button>
            <button type="button"
              class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700"
              id="confirm-delete-btn">Elimina</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js?v=99"></script>
  <script src="/js/api-app.js?v=7"></script>
  <script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
  <script src="/js/template-loader.js?v=101"></script>
  <script src="/js/admin-panel.js?v=6"></script>
  <script src="/js/form-handlers.js"></script>
  <script src="/js/navbar.js?v=100"></script>`n
  <script src="/js/pages/cinemas.js"></script>
  <script>
    function openModal(modalId, title = 'Aggiungi') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById(modalId).classList.remove('hidden');
      document.getElementById('cinema-form').reset();
      document.getElementById('cinema-form').dataset.editId = '';
    }
    function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }
    function openDeleteModal(itemName, callback) {
      document.getElementById('delete-message').textContent = `Sei sicuro di voler eliminare "${itemName}"?`;
      document.getElementById('delete-modal').classList.remove('hidden');
      document.getElementById('confirm-delete-btn').onclick = () => { callback(); closeDeleteModal(); };
    }
    function closeDeleteModal() { document.getElementById('delete-modal').classList.add('hidden'); }
  </script>
</body>

</html>
