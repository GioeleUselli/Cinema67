<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 — Shop</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  <style>
    .cart-badge { animation: cartPop 0.3s ease; }
    @keyframes cartPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes slideIn { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(100%); opacity: 0; } }
    .cart-sidebar-enter { animation: slideIn 0.3s ease forwards; }
    .cart-sidebar-exit { animation: slideOut 0.3s ease forwards; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--brand-gold); border-radius: 999px; }
  </style>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans cine-velvet min-h-screen">
  <div id="navbar-container"></div>

  <main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">
    <!-- Hero -->
    <section class="mb-8">
      <div class="cine-premium-card p-6 sm:p-8 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-56 h-56 rounded-full bg-brand-gold/5 blur-3xl pointer-events-none"></div>
        <div class="relative flex items-center justify-between">
          <div>
            <p class="cine-kicker">Collezione Ufficiale</p>
            <h1 class="cine-headline text-brand-on-surface mt-1">Shop Cinema67</h1>
            <p class="mt-2 text-sm text-brand-on-surface-variant max-w-xl">Scopri la nostra collezione di merchandise ufficiale: abbigliamento, poster, gadget e oggetti da collezione.</p>
          </div>
          <button id="cart-toggle" class="relative btn-gold px-4 py-2 text-sm">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="hidden absolute -top-1.5 -right-1.5 bg-brand-red text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center cart-badge">0</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Products Grid -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="products-grid">
      <div class="col-span-full text-center py-12 text-brand-on-surface-variant">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
        <p>Caricamento articoli...</p>
      </div>
    </section>

    <!-- My Orders -->
    <section id="my-orders-section" class="mt-12 hidden">
      <div class="cine-premium-card p-6">
        <h2 class="text-sm font-bold uppercase tracking-[0.15em] text-brand-gold mb-6 flex items-center gap-2">
          <i class="fa-solid fa-box"></i> I Miei Ordini
        </h2>
        <div id="my-orders-list" class="space-y-4"></div>
      </div>
    </section>
  </main>

  <!-- Cart Sidebar -->
  <div id="cart-overlay" class="hidden fixed inset-0 bg-black/40 z-50" onclick="closeCart()"></div>
  <aside id="cart-sidebar" class="hidden fixed top-0 right-0 h-full w-full max-w-md bg-brand-surface-container border-l border-brand-outline-variant/20 z-50 flex flex-col shadow-2xl">
    <div class="flex items-center justify-between p-4 border-b border-brand-outline-variant/20">
      <h2 class="text-lg font-bold text-brand-on-surface flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping text-brand-gold"></i> Carrello
        <span id="cart-sidebar-count" class="text-sm text-brand-on-surface-variant font-normal"></span>
      </h2>
      <button onclick="closeCart()" class="text-brand-on-surface-variant hover:text-brand-red transition-colors text-xl">&times;</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div id="cart-totale" class="p-4 border-t border-brand-outline-variant/20">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-semibold text-brand-on-surface-variant">Totale</span>
        <span id="cart-totale-amount" class="text-xl font-bold text-brand-gold font-serif">€0.00</span>
      </div>
      <div id="discount-section" class="mb-3 hidden">
        <div class="flex gap-2 mb-2">
          <input type="text" id="discount-input" placeholder="Codice sconto" maxlength="50" class="flex-1 text-xs rounded-lg bg-brand-surface-container border border-brand-outline-variant/30 px-3 py-1.5 text-brand-on-surface focus:border-brand-gold" autocomplete="off">
          <button onclick="applyDiscount()" class="btn-outline-brand text-xs px-3 py-1">Applica</button>
        </div>
        <div id="discount-msg" class="text-xs"></div>
      </div>
      <button id="btn-acquista" onclick="checkoutCart()" class="w-full btn-gold py-3 font-semibold" disabled>
        <i class="fa-solid fa-credit-card mr-2"></i>Acquista
      </button>
    </div>
  </aside>

  <div id="footer-container"></div>

  <!-- Delivery Modal -->
  <div id="delivery-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center bg-black/70 p-4">
    <div class="cine-premium-card p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold text-brand-on-surface mb-4">Dettagli Consegna</h3>

      <div class="flex gap-2 mb-4">
        <button id="tab-ritiro-btn" onclick="switchDeliveryTab('ritiro')" class="flex-1 py-2 text-xs font-semibold rounded-xl border bg-brand-gold/10 text-brand-gold border-brand-gold/20">Ritiro al Cinema</button>
        <button id="tab-spedizione-btn" onclick="switchDeliveryTab('spedizione')" class="flex-1 py-2 text-xs font-semibold rounded-xl border border-brand-outline-variant/30 text-brand-on-surface-variant hover:border-brand-gold/20">Spedizione a casa</button>
      </div>

      <div id="delivery-tab-ritiro">
        <label class="block text-xs text-brand-on-surface-variant mb-1">Scegli il cinema</label>
        <select id="ritiro-cinema" onchange="updateShippingEstimate()" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold mb-3">
          <option value="">Caricamento...</option>
        </select>
      </div>

      <div id="delivery-tab-spedizione" class="hidden space-y-3">
        <div><label class="block text-xs text-brand-on-surface-variant mb-1">Indirizzo *</label><input type="text" id="delivery-indirizzo" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold" placeholder="Via Roma 12"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-brand-on-surface-variant mb-1">Città *</label><input type="text" id="delivery-citta" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold" placeholder="Milano"></div>
          <div><label class="block text-xs text-brand-on-surface-variant mb-1">CAP *</label><input type="text" id="delivery-cap" maxlength="10" oninput="updateShippingEstimate()" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold" placeholder="20100"></div>
        </div>
        <div><label class="block text-xs text-brand-on-surface-variant mb-1">Provincia</label><input type="text" id="delivery-provincia" maxlength="50" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold" placeholder="MI"></div>
        <div><label class="block text-xs text-brand-on-surface-variant mb-1">Telefono *</label><input type="text" id="delivery-telefono" maxlength="20" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold" placeholder="+39 333 1234567"></div>
      </div>

      <div id="shipping-cost-display" class="mb-3 p-3 rounded-lg bg-brand-surface-container border border-brand-gold/10 text-sm space-y-1">
        <div><span class="text-brand-on-surface-variant">Spedizione: </span><span id="shipping-cost-amount" class="font-bold text-brand-gold">€0.00</span><span id="shipping-free-badge" class="ml-1 text-xs text-green-400">(Gratuita!)</span></div>
        <div id="shipping-eta-line"><span class="text-brand-on-surface-variant">Consegna prevista: </span><span id="shipping-eta" class="text-brand-on-surface text-xs"></span></div>
      </div>

      <div class="flex gap-3 pt-4">
        <button onclick="closeDeliveryModal()" class="btn-ghost text-sm flex-1">Annulla</button>
        <button onclick="confirmDelivery()" class="btn-gold text-sm flex-1">
          <i class="fa-solid fa-check mr-1"></i>Conferma e Vai al Pagamento
        </button>
      </div>
    </div>
  </div>

  <script src="/js/utils.js?v=99"></script>
<script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
  <script src="/js/runtime-config.js"></script>
    <script src="/js/api-app.js?v=103"></script>
  <script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
  <script src="/js/template-loader.js?v=101"></script>
  <script src="/js/navbar.js?v=100"></script>

  <script>
    let cart = [];
    let products = [];
    let discountState = { codice: null, percentuale: 0, valoreFisso: 0, totaleOriginale: 0 };
    function saveCart() { 
      localStorage.setItem('cinema67_merch_cart', JSON.stringify(cart)); 
      syncCartToBackend();
    }
    function loadCart() {
      try { cart = JSON.parse(localStorage.getItem('cinema67_merch_cart') || '[]'); } catch (e) { cart = []; }
    }
    async function syncCartToBackend() {
      if (!window.Auth || !window.Auth.isLoggedIn || !window.Auth.isLoggedIn()) return;
      try {
        var backendItems = cart.map(function(c) { return { merchItemId: c.id, quantita: c.qty, variantId: c.variantId || null }; });
        await API.saveCart(backendItems);
      } catch(e) { /* silent */ }
    }
    async function loadCartFromBackend() {
        if (!window.Auth || !window.Auth.isLoggedIn || !window.Auth.isLoggedIn()) return false;
        try {
          var backendItems = await API.getCart();
          if (backendItems && backendItems.length > 0) {
          var enriched = [];
          for (var i = 0; i < backendItems.length; i++) {
            var bi = backendItems[i];
            var product = products.find(function(p) { return p.id === bi.merchItemId; });
            enriched.push({ id: bi.merchItemId, name: product ? product.nome : ('Articolo #' + bi.merchItemId), price: product ? product.prezzo : 0, qty: bi.quantita, variantId: bi.variantId });
          }
            cart = enriched;
            saveCart(); // persist to localStorage too
            return true;
          }
          return false;
        } catch(e) { return false; }
    }
    function updateCartUI() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const countEl = document.getElementById('cart-count');
      if (count > 0) { countEl.textContent = count; countEl.classList.remove('hidden'); countEl.classList.add('flex'); }
      else { countEl.classList.add('hidden'); countEl.classList.remove('flex'); }
      document.getElementById('cart-sidebar-count').textContent = `(${count} articoli)`;

      const itemsContainer = document.getElementById('cart-items');
      const totale = cart.reduce((s, i) => s + i.price * i.qty, 0);
      discountState.totaleOriginale = totale;
      var discounted = totale;
      if (discountState.percentuale > 0) discounted = Math.round((totale * (1 - discountState.percentuale / 100)) * 100) / 100;
      else if (discountState.valoreFisso > 0) discounted = Math.max(0, totale - discountState.valoreFisso);
      document.getElementById('cart-totale-amount').textContent = '€' + discounted.toFixed(2);
      document.getElementById('btn-acquista').disabled = cart.length === 0;

      var discSection = document.getElementById('discount-section');
      if (cart.length > 0) { discSection.classList.remove('hidden'); }
      else { discSection.classList.add('hidden'); discountState.codice = null; discountState.percentuale = 0; discountState.valoreFisso = 0; }

      itemsContainer.innerHTML = cart.length === 0
        ? `<p class="text-center text-brand-on-surface-variant py-8"><i class="fa-solid fa-cart-shopping text-3xl mb-3 block"></i>Il carrello è vuoto</p>`
        : cart.map((item, idx) => `
          <div class="flex items-center gap-3 p-3 rounded-xl bg-brand-surface-container-high border border-brand-outline-variant/10">
            <div class="w-12 h-12 rounded-lg bg-brand-surface flex items-center justify-center text-brand-gold text-lg flex-shrink-0">
              <i class="fa-solid fa-film"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold text-brand-on-surface truncate">${escapeHtml(item.name)}</p>
              <p class="text-xs text-brand-on-surface-variant">€${item.price.toFixed(2)} &times; ${item.qty}</p>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="changeQty(${idx}, -1)" class="w-7 h-7 rounded-lg bg-brand-surface border border-brand-outline-variant/20 flex items-center justify-center text-xs text-brand-on-surface hover:text-brand-gold"><i class="fa-solid fa-minus"></i></button>
              <span class="w-6 text-center text-sm font-semibold">${item.qty}</span>
              <button onclick="changeQty(${idx}, 1)" class="w-7 h-7 rounded-lg bg-brand-surface border border-brand-outline-variant/20 flex items-center justify-center text-xs text-brand-on-surface hover:text-brand-gold"><i class="fa-solid fa-plus"></i></button>
            </div>
            <button onclick="removeFromCart(${idx})" class="text-brand-on-surface-variant hover:text-brand-red ml-1"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </div>
        `).join('');
    }

    function changeQty(idx, delta) {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveCart();
      updateCartUI();
    }

    function removeFromCart(idx) { cart.splice(idx, 1); saveCart(); updateCartUI(); }

    function closeCart() {
      document.getElementById('cart-overlay').classList.add('hidden');
      document.getElementById('cart-sidebar').classList.add('hidden');
    }

    function openCart() {
      document.getElementById('cart-overlay').classList.remove('hidden');
      document.getElementById('cart-sidebar').classList.remove('hidden');
    }

    function escapeHtml(str) {
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    const CATEGORY_ICONS = {
      'Abbigliamento': 'fa-solid fa-shirt',
      'Poster': 'fa-solid fa-image',
      'Gadget': 'fa-solid fa-mug-hot',
      'Collezionabili': 'fa-solid fa-star',
    };

    function getCardImage(p) {
      if (p.immagini && p.immagini.length > 0) return API_BASE_URL + p.immagini[0];
      if (p.immaginePath) return API_BASE_URL + p.immaginePath;
      return null;
    }

    function renderProducts(items) {
      const grid = document.getElementById('products-grid');
      if (!items.length) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-brand-on-surface-variant"><i class="fa-solid fa-store-slash text-3xl mb-3 block"></i>Nessun articolo disponibile al momento.</div>';
        return;
      }
      grid.innerHTML = items.map(p => {
        const inCart = cart.find(c => c.id === p.id);
        const inCartQty = inCart ? inCart.qty : 0;
        const catIcon = CATEGORY_ICONS[p.categoria] || 'fa-solid fa-box';
        return `
          <div class="cine-premium-card p-4 flex flex-col hover:border-brand-gold/30 transition-all group">
            <a href="/articolo.html?id=${p.id}" class="block relative mb-3 cursor-pointer">
              <div class="w-full aspect-square rounded-xl bg-brand-surface-dim flex items-center justify-center text-brand-gold text-5xl overflow-hidden">
                ${getCardImage(p) ? `<img src="${escapeHtml(getCardImage(p))}" alt="${escapeHtml(p.nome)}" class="w-full h-full object-cover" />` : `<i class="fa-solid fa-film"></i>`}
              </div>
              <span class="absolute top-2 left-2 text-[10px] uppercase tracking-widest bg-brand-gold/10 text-brand-gold px-2 py-0.5 rounded-full border border-brand-gold/20">
                <i class="${catIcon} mr-1"></i>${escapeHtml(p.categoria)}
              </span>
              ${p.varianti && p.varianti.length ? `<span class="absolute bottom-2 right-2 text-[10px] bg-brand-surface/80 text-brand-on-surface-variant px-1.5 py-0.5 rounded-full">${p.varianti.length} var.</span>` : ''}
              ${inCartQty > 0 ? `<span class="absolute top-2 right-2 bg-brand-red text-white text-[10px] font-bold px-2 py-0.5 rounded-full">x${inCartQty}</span>` : ''}
            </a>
            <a href="/articolo.html?id=${p.id}" class="block cursor-pointer">
              <h3 class="text-sm font-bold text-brand-on-surface mb-1 group-hover:text-brand-gold transition-colors">${escapeHtml(p.nome)}</h3>
              ${p.descrizione ? `<p class="text-xs text-brand-on-surface-variant mb-3 line-clamp-2 flex-1">${escapeHtml(p.descrizione)}</p>` : '<div class="flex-1"></div>'}
            </a>
            <div class="flex items-center justify-between mt-auto pt-3 border-t border-brand-outline-variant/10">
              <span class="text-lg font-bold text-brand-gold font-serif">€${p.prezzo.toFixed(2)}</span>
              ${p.varianti && p.varianti.length > 0 
                ? `<a href="/articolo.html?id=${p.id}" class="btn-outline-brand text-xs px-3 py-1.5"><i class="fa-solid fa-list-check mr-1"></i>Scegli</a>`
                : `<button onclick="event.stopPropagation(); addToCart(${p.id}, '${escapeHtml(p.nome).replace(/'/g, "\\'")}', ${p.prezzo}, ${p.stock})" 
                class="btn-outline-brand text-xs px-3 py-1.5 ${inCartQty >= p.stock ? 'opacity-50 pointer-events-none' : ''}"
                ${inCartQty >= p.stock ? 'disabled' : ''}>
                <i class="fa-solid fa-cart-plus mr-1"></i>Aggiungi
              </button>`}
            </div>
          </div>`;
      }).join('');
    }

    function addToCart(id, name, price, maxStock) {
      const existing = cart.find(c => c.id === id);
      if (existing) {
        if (existing.qty >= maxStock) return;
        existing.qty++;
      } else {
        cart.push({ id, name, price, qty: 1 });
      }
      saveCart();
      updateCartUI();
      renderProducts(products);
    }

    async function applyDiscount() {
      var code = document.getElementById('discount-input').value.trim();
      if (!code) { document.getElementById('discount-msg').innerHTML = ''; discountState.codice = null; discountState.percentuale = 0; discountState.valoreFisso = 0; updateCartUI(); return; }
      try {
        var r = await API.validateDiscount(code);
        if (r.valido) {
          discountState.codice = r.codice;
          discountState.percentuale = r.percentualeSconto || 0;
          discountState.valoreFisso = r.valoreScontoFisso || 0;
          document.getElementById('discount-msg').innerHTML = '<span class="text-green-400">' + r.messaggio + '</span>';
        } else {
          discountState.codice = null; discountState.percentuale = 0;
          document.getElementById('discount-msg').innerHTML = '<span class="text-brand-red">' + (r.messaggio || 'Codice non valido') + '</span>';
        }
      } catch(e) { document.getElementById('discount-msg').innerHTML = '<span class="text-brand-red">Errore</span>'; }
      updateCartUI();
    }

    async function loadProducts() {
      try {
        products = await API.getMerchItems();
        renderProducts(products);
      } catch (e) {
        document.getElementById('products-grid').innerHTML = `<div class="col-span-full text-center py-12 text-brand-red"><i class="fa-solid fa-triangle-exclamation text-3xl mb-3 block"></i>${escapeHtml(e.message || 'Errore caricamento articoli')}</div>`;
      }
    }

    async function checkoutCart() {
      if (cart.length === 0) return;
      if (!window.Auth || !window.Auth.isLoggedIn || !window.Auth.isLoggedIn()) {
        window.Auth.redirectToLogin('/shop.html');
        return;
      }
      // Load cinemas and show delivery modal
      await loadCinemasForDelivery();
      openDeliveryModal();
    }

    async function loadCinemasForDelivery() {
      try {
        var data = await API.getCinemas();
        var cinemas = Array.isArray(data?.items) ? data.items : Array.isArray(data) ? data : [];
        var sel = document.getElementById('ritiro-cinema');
        sel.innerHTML = cinemas.map(function(c) { return '<option value="' + c.id + '">' + escapeHtml(c.nome) + ' — ' + escapeHtml(c.citta || '') + '</option>'; }).join('');
        if (cinemas.length === 0) sel.innerHTML = '<option value="">Nessun cinema disponibile</option>';
      } catch(e) { document.getElementById('ritiro-cinema').innerHTML = '<option value="">Errore caricamento</option>'; }
    }

    var deliveryMode = 'ritiro';
    function switchDeliveryTab(mode) {
      deliveryMode = mode;
      var ritiro = document.getElementById('delivery-tab-ritiro'), sped = document.getElementById('delivery-tab-spedizione');
      var rbtn = document.getElementById('tab-ritiro-btn'), sbtn = document.getElementById('tab-spedizione-btn');
      if (mode === 'ritiro') {
        ritiro.classList.remove('hidden'); sped.classList.add('hidden');
        rbtn.className = 'flex-1 py-2 text-xs font-semibold rounded-xl border bg-brand-gold/10 text-brand-gold border-brand-gold/20';
        sbtn.className = 'flex-1 py-2 text-xs font-semibold rounded-xl border border-brand-outline-variant/30 text-brand-on-surface-variant hover:border-brand-gold/20';
      } else {
        ritiro.classList.add('hidden'); sped.classList.remove('hidden');
        rbtn.className = 'flex-1 py-2 text-xs font-semibold rounded-xl border border-brand-outline-variant/30 text-brand-on-surface-variant hover:border-brand-gold/20';
        sbtn.className = 'flex-1 py-2 text-xs font-semibold rounded-xl border bg-brand-gold/10 text-brand-gold border-brand-gold/20';
      }
      updateShippingEstimate();
    }

    function openDeliveryModal() { document.getElementById('delivery-modal').classList.remove('hidden'); updateShippingEstimate(); }
    function closeDeliveryModal() { document.getElementById('delivery-modal').classList.add('hidden'); }

    async function updateShippingEstimate() {
      var tipo = deliveryMode, cinemaId = null, cap = null;
      if (tipo === 'ritiro') {
        var sel = document.getElementById('ritiro-cinema');
        cinemaId = sel.value ? parseInt(sel.value) : null;
      } else {
        cap = document.getElementById('delivery-cap').value.trim() || null;
      }
      try {
        var params = new URLSearchParams();
        params.set('tipo', tipo === 'ritiro' ? 'RitiroCinema' : 'Spedizione');
        if (cinemaId) params.set('cinemaId', cinemaId);
        if (cap) params.set('cap', cap);
        var resp = await fetch(API_BASE_URL + '/merch/shipping/estimate?' + params.toString());
        if (resp.ok) {
          var data = await resp.json();
          document.getElementById('shipping-cost-amount').textContent = '€' + data.costo.toFixed(2);
          document.getElementById('shipping-free-badge').style.display = data.gratis ? 'inline' : 'none';
          if (data.dataPrevista) {
            var d = new Date(data.dataPrevista);
            document.getElementById('shipping-eta').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }) + ' (14:00–18:00)';
            document.getElementById('shipping-eta-line').style.display = '';
          } else {
            document.getElementById('shipping-eta-line').style.display = 'none';
          }
        }
      } catch(e) {}
    }

    async function confirmDelivery() {
      var dto = { items: cart.map(c => ({ merchItemId: c.id, quantita: c.qty, variantId: c.variantId || null })), discountCode: discountState.codice || null };

      if (deliveryMode === 'spedizione') {
        dto.tipoConsegna = 'Spedizione';
        dto.indirizzo = document.getElementById('delivery-indirizzo').value.trim();
        dto.citta = document.getElementById('delivery-citta').value.trim();
        dto.cap = document.getElementById('delivery-cap').value.trim();
        dto.provincia = document.getElementById('delivery-provincia').value.trim();
        dto.telefono = document.getElementById('delivery-telefono').value.trim();
        if (!dto.indirizzo || !dto.citta || !dto.cap) { alert('Indirizzo, Città e CAP sono obbligatori per la spedizione.'); return; }
      } else {
        dto.tipoConsegna = 'RitiroCinema';
        var cinemaId = parseInt(document.getElementById('ritiro-cinema').value);
        dto.cinemaRitiroId = cinemaId || null;
      }

      closeDeliveryModal();
      var btn = document.getElementById('btn-acquista');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Creazione ordine...';
      try {
        var result = await API.createMerchOrder(dto);
        closeCart();
        window.location.href = '/pagamento-merch.html?orderId=' + result.id;
      } catch (e) {
        alert('Errore: ' + (e.message || 'Impossibile creare l\'ordine.'));
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-credit-card mr-2"></i>Acquista';
      }
    }

    async function loadMyOrders() {
      if (!window.Auth || !window.Auth.isLoggedIn || !window.Auth.isLoggedIn()) return;
      try {
        const orders = await API.getMyMerchOrders();
        const section = document.getElementById('my-orders-section');
        const list = document.getElementById('my-orders-list');
        if (!orders || !orders.length) {
          section.classList.add('hidden');
          return;
        }
        section.classList.remove('hidden');
        const shippingLabels = { 'InAttesa': 'In attesa','Pronto':'Pronto','InCarico':'In carico','InConsegna':'In consegna','Consegnato':'Consegnato' };
        list.innerHTML = orders.map(o => `
          <div class="p-4 rounded-xl bg-brand-surface-container-high border border-brand-outline-variant/10 cursor-pointer hover:border-brand-gold/30" onclick="window.location.href='/tracking-merch.html?orderId=${o.id}'">
            <div class="flex items-center justify-between mb-2">
              <div>
                <span class="text-xs font-mono text-brand-gold">${escapeHtml(o.codiceOrdine || '')}</span>
                <span class="ml-2 text-[10px] uppercase tracking-widest ${o.stato==='Paid'?'text-green-400':o.stato==='Cancelled'?'text-brand-red':'text-yellow-400'}">${escapeHtml(o.stato)}</span>
                ${o.stato==='Paid' ? `<span class="ml-2 text-[10px] text-brand-gold">${shippingLabels[o.statoSpedizione]||o.statoSpedizione||''}</span>` : ''}
              </div>
              <span class="text-sm text-brand-on-surface-variant">${new Date(o.createdAtUtc).toLocaleDateString('it-IT')}</span>
            </div>
            <div class="space-y-1">
              ${o.items.map(i => `
                <div class="flex justify-between text-xs text-brand-on-surface-variant">
                  <span>${escapeHtml(i.nome)} &times; ${i.quantita}</span>
                  <span>€${i.subTotale.toFixed(2)}</span>
                </div>
              `).join('')}
            </div>
            <div class="mt-2 pt-2 border-t border-brand-outline-variant/10 flex justify-between">
              <span class="text-sm font-bold text-brand-on-surface">Totale</span>
              <span class="text-sm font-bold text-brand-gold font-serif">€${o.totale.toFixed(2)}</span>
            </div>
          </div>
        `).join('');
      } catch (e) { /* silent */ }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadProducts();
      // Prima carica dal backend (sorgente primaria, condivisa tra dispositivi)
      var loadedFromBackend = await loadCartFromBackend();
      // Se non loggato o backend vuoto, usa localStorage come fallback
      if (!loadedFromBackend) {
        loadCart();
      }
      updateCartUI();
      await loadMyOrders();

      document.getElementById('cart-toggle').addEventListener('click', openCart);
    });
  </script>
</body>
</html>
