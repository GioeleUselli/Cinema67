<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 - Gestione Categorie</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  </head>

<body class="bg-brand-surface text-brand-on-surface font-sans cine-velvet">
  <div id="navbar-container"></div>

  <main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">

    <!-- HEADER -->
    <section class="cine-curtain-in mb-8">
      <div class="cine-premium-card p-6 sm:p-8 relative overflow-hidden">
        <div class="absolute -top-16 -right-16 w-48 h-48 rounded-full bg-brand-red/5 blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-8 -left-8 w-36 h-36 rounded-full bg-brand-gold/5 blur-2xl pointer-events-none"></div>
        <div class="relative flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p class="cine-kicker">Taxonomy editor</p>
            <h1 class="cine-headline text-brand-on-surface">Gestione Categorie</h1>
            <p class="mt-2 text-sm text-brand-on-surface-variant">Definisci e mantieni il vocabolario categorie del catalogo film.</p>
          </div>
          <button onclick="openModal('categoria-modal', 'Aggiungi Categoria')" class="btn-gold text-white px-4 py-2 rounded-lg text-sm font-medium">
            <i class="fa-solid fa-plus mr-2"></i>Aggiungi Categoria
          </button>
        </div>
      </div>
    </section>

    <!-- TABLE -->
    <section class="cine-curtain-in cine-curtain-delay-1 mb-8 cine-premium-card overflow-x-auto">
      <table class="min-w-full divide-y divide-brand-outline-variant/10">
        <thead class="bg-brand-surface-container/50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Nome</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Azioni</th>
          </tr>
        </thead>
        <tbody id="categorie-table-body" class="bg-brand-surface divide-y divide-brand-outline-variant/10">
          <tr>
            <td colspan="3" class="px-6 py-4 text-center text-brand-on-surface-variant">Caricamento...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <div id="footer-container"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <!-- Modal -->
  <div id="categoria-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-gray-500/75 modal-backdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div
          class="relative transform overflow-hidden rounded-xl bg-brand-surface-container-lowest text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md">
          <div class="bg-brand-surface-container-lowest px-6 pt-6 pb-4">
            <h3 class="text-lg font-bold text-brand-on-surface" id="modal-title">Aggiungi Categoria</h3>
            <button type="button"
              class="absolute top-4 right-4 text-brand-on-surface-variant hover:text-brand-on-surface"
              onclick="closeModal('categoria-modal')" title="Chiudi" aria-label="Chiudi modal">
              <i class="fa-solid fa-xmark text-xl"></i>
            </button>
          </div>
          <div class="bg-brand-surface-container-lowest px-6 pb-4">
            <form id="categoria-form" class="space-y-4">
              <input type="hidden" name="id" value="">
              <div>
                <label for="categoria-nome" class="block text-sm font-medium text-brand-on-surface mb-1">Nome</label>
                <input type="text" id="categoria-nome" name="nome" required placeholder="Nome categoria"
                  class="ghost-input w-full px-4 py-2">
              </div>
            </form>
          </div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button type="button" class="btn-outline-brand px-4 py-2 rounded-lg text-sm font-medium"
              onclick="closeModal('categoria-modal')">Annulla</button>
            <button type="submit" form="categoria-form" class="btn-gold">Salva</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="delete-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-gray-500/75 modal-backdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div
          class="relative transform overflow-hidden rounded-xl bg-brand-surface-container-lowest text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md">
          <div class="bg-brand-surface-container-lowest px-6 pt-6 pb-4">
            <div class="flex items-center gap-4">
              <div class="flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                <i class="fa-solid fa-triangle-exclamation text-red-600 text-xl"></i>
              </div>
              <div>
                <h3 class="text-lg font-bold text-brand-on-surface">Conferma Eliminazione</h3>
                <p class="text-sm text-brand-on-surface-variant mt-1" id="delete-message">Sei sicuro di voler eliminare
                  questa categoria?</p>
              </div>
            </div>
          </div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button type="button" class="btn-outline-brand px-4 py-2 rounded-lg text-sm font-medium"
              onclick="closeDeleteModal()">Annulla</button>
            <button type="button"
              class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700"
              id="confirm-delete-btn">Elimina</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js?v=99"></script>
<script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
  <script src="/js/runtime-config.js"></script>
    <script src="/js/api-app.js?v=7"></script>
  <script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
  <script src="/js/template-loader.js?v=101"></script>
  <script src="/js/admin-panel.js?v=6"
  <script src="/js/admin-shell.js?v=100"></script>
  <script src="/js/staff-shell.js?v=1"></script>></script>
  <script src="/js/form-handlers.js"></script>
  <script src="/js/navbar.js?v=100"></script>`n
  <script src="/js/pages/categorie.js"></script>
  <script>
    function openModal(modalId, title = 'Aggiungi') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById(modalId).classList.remove('hidden');
      document.getElementById('categoria-form').reset();
      document.getElementById('categoria-form').dataset.editId = '';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    function openDeleteModal(itemName, callback) {
      document.getElementById('delete-message').textContent = `Sei sicuro di voler eliminare la categoria "${itemName}"?`;
      document.getElementById('delete-modal').classList.remove('hidden');
      document.getElementById('confirm-delete-btn').onclick = () => {
        callback();
        closeDeleteModal();
      };
    }

    function closeDeleteModal() {
      document.getElementById('delete-modal').classList.add('hidden');
    }
  </script>
</body>

</html>
