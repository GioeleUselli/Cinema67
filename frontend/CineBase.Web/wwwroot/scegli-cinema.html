<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 - Scegli il tuo Cinema</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js?v=99"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=99" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  <script src="/js/route-guard.js?v=99"></script>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>
  <div class="flex-1 px-4 py-20">
    <div class="mx-auto max-w-2xl text-center mb-10">
      <p class="cine-kicker">Benvenuto in Cinema67</p>
      <h1 class="cine-headline text-brand-on-surface mt-2">Scegli il tuo cinema preferito</h1>
      <p class="mt-3 text-sm text-brand-on-surface-variant">Questo cinema verrà usato come predefinito per programmazione e suggerimenti. Puoi cambiarlo in qualsiasi momento dal profilo.</p>
      <a href="/index.html" class="inline-block mt-4 text-xs text-brand-on-surface-variant hover:text-brand-gold">Salta, lo sceglierò dopo</a>
    </div>
    <div id="cinema-list" class="mx-auto max-w-3xl grid grid-cols-1 sm:grid-cols-2 gap-4">
      <p class="col-span-full text-center text-brand-on-surface-variant">Caricamento cinema...</p>
    </div>
  </div>
  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>
  <script src="/js/utils.js?v=99"></script>
  <script src="/js/api-app.js?v=99"></script>
  <script src="/js/auth.js?v=99"></script>
  <script src="/js/template-loader.js?v=99"></script>
  <script src="/js/navbar.js?v=99"></script>
  <script>
    (function(){
      var Auth = window.Auth;
      if (!Auth || !Auth.isLoggedIn || !Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }

      async function load() {
        try {
          var cinemas = await API.getCinemas();
          var items = normalizeCollection(cinemas);
          var h = document.getElementById('cinema-list');
          if (!items.length) { h.innerHTML = '<p class="col-span-full text-center">Nessun cinema disponibile.</p>'; return; }
          h.innerHTML = items.map(function(c){
            return '<button onclick="selectCinema(' + c.id + ')" class="cine-admin-slab p-5 text-left hover:ring-2 hover:ring-brand-gold/30 transition-all"><div class="flex items-start gap-3"><span class="inline-flex h-12 w-12 items-center justify-center rounded-lg bg-brand-gold text-white text-xl"><i class="fa-solid fa-location-dot"></i></span><div><p class="text-lg font-bold">' + escapeHtml(c.nome) + '</p><p class="text-sm text-brand-on-surface-variant">' + escapeHtml(c.indirizzo || '') + ', ' + escapeHtml(c.citta || '') + '</p></div></div></button>';
          }).join('');
        } catch(e) { document.getElementById('cinema-list').innerHTML = '<p class="col-span-full text-center text-brand-error">Errore caricamento.</p>'; }
      }

      window.selectCinema = async function(id){
        try {
          await API.updateUserCinema(Auth.getUser().id, { cinemaId: id });
          window.location.href = '/index.html';
        } catch(e) { window.location.href = '/index.html'; }
      };

      document.addEventListener('DOMContentLoaded', load);
    })();
  </script>
</body>
</html>
