<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 — Accesso in corso...</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/runtime-config.js"></script>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex items-center justify-center cine-velvet">
  <div class="text-center cine-curtain-in">
    <div class="relative mb-6">
      <div class="absolute inset-0 w-20 h-20 rounded-full bg-brand-gold/10 blur-2xl mx-auto"></div>
      <i class="fa-solid fa-spinner fa-spin text-4xl text-brand-gold relative z-10"></i>
    </div>
    <p class="text-brand-on-surface-variant text-sm">Completando l'accesso...</p>
    <p id="err" class="hidden text-brand-error text-sm mt-2"></p>
  </div>
  <script>
    (function(){
      var p = new URLSearchParams(window.location.search);
      var accessToken = p.get('accessToken');
      var refreshToken = p.get('refreshToken');
      var email = p.get('email');
      var nome = p.get('nome');
      var userId = p.get('userId');

      if (accessToken && refreshToken) {
        try { sessionStorage.setItem('cb_access_token', accessToken); } catch(e){}
        try { sessionStorage.setItem('cb_refresh_token', refreshToken); } catch(e){}
        try { sessionStorage.setItem('cb_device_id', 'social-default'); } catch(e){}
        try { sessionStorage.setItem('cb_user', JSON.stringify({ id: parseInt(userId) || 0, nome: nome || '', email: email || '', ruolo: 'User' })); } catch(e){}
        window.location.href = '/index.html';
      } else {
        var el = document.getElementById('err');
        el.textContent = 'Token mancanti. Riprova il login.';
        el.classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
