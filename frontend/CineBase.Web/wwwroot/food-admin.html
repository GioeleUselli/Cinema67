<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 — Gestione Food</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    #qr-reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans cine-velvet">
  <main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">

    <section class="cine-premium-card p-6 sm:p-8 relative overflow-hidden mb-8">
      <div class="absolute -top-24 -right-24 w-56 h-56 rounded-full bg-brand-gold/5 blur-3xl pointer-events-none"></div>
      <div class="relative flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
        <div>
          <p class="cine-kicker">Admin</p>
          <h1 class="cine-headline text-brand-on-surface mt-1">Gestione Food & Beverage</h1>
        </div>
        <button onclick="openAddModal()" class="btn-gold text-sm"><i class="fa-solid fa-plus mr-2"></i> Aggiungi Prodotto</button>
      </div>
    </section>

    <!-- Scanner Cassa -->
    <section class="cine-premium-card p-6 mb-8">
      <h3 class="text-sm font-bold uppercase tracking-[0.15em] text-brand-gold mb-4"><i class="fa-solid fa-qrcode mr-1"></i>Cassa — Scannerizza codice ritiro cibo</h3>
      <div class="flex gap-2 mb-3">
        <button id="btn-start-scan" onclick="startScanner()" class="btn-gold text-xs px-4 py-2"><i class="fa-solid fa-camera mr-1"></i>Scansiona QR</button>
        <button id="btn-stop-scan" onclick="stopScanner()" class="btn-outline-brand text-xs px-4 py-2 hidden"><i class="fa-solid fa-stop mr-1"></i>Ferma</button>
      </div>
      <div id="qr-reader" class="hidden mb-3"></div>
      <div class="flex gap-2">
        <input type="text" id="receipt-input" placeholder="Oppure scrivi codice (C67-FOOD-...)" class="flex-1 ghost-input px-4 py-2 text-sm uppercase" style="letter-spacing:1px" autocomplete="off">
        <button onclick="lookupReceipt()" class="btn-gold text-sm px-4 py-2"><i class="fa-solid fa-search mr-1"></i>Cerca</button>
      </div>
      <div id="receipt-result" class="mt-4"></div>
    </section>

    <div class="cine-premium-card overflow-x-auto">
      <table class="min-w-full divide-y divide-brand-outline-variant/10">
        <thead class="bg-brand-surface-container/50">
          <tr>
            <th class="px-4 py-3 text-left label-caps">Immagine</th>
            <th class="px-4 py-3 text-left label-caps">Nome</th>
            <th class="px-4 py-3 text-left label-caps">Categoria</th>
            <th class="px-4 py-3 text-left label-caps">Prezzo</th>
            <th class="px-4 py-3 text-left label-caps">Attivo</th>
            <th class="px-4 py-3 text-left label-caps">Azioni</th>
          </tr>
        </thead>
        <tbody id="food-table" class="divide-y divide-brand-outline-variant/10">
          <tr><td colspan="6" class="px-4 py-8 text-center">Caricamento...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div id="food-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-gray-500/75"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-xl bg-brand-surface-container-lowest text-left shadow-xl sm:my-8 sm:w-full sm:max-w-lg">
          <div class="px-6 pt-6 pb-4 flex justify-between items-center">
            <h3 class="text-lg font-bold" id="modal-title">Nuovo Prodotto</h3>
            <button onclick="closeFoodModal()" class="text-brand-on-surface-variant"><i class="fa-solid fa-xmark text-xl"></i></button>
          </div>
          <div class="px-6 pb-4">
            <form id="food-form" class="space-y-4">
              <input type="hidden" name="id">
              <div><label class="block text-sm mb-1">Nome</label><input name="nome" required class="ghost-input w-full px-4 py-2" placeholder="Popcorn"></div>
              <div><label class="block text-sm mb-1">Descrizione</label><input name="descrizione" class="ghost-input w-full px-4 py-2" placeholder="Descrizione breve"></div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-sm mb-1">Categoria</label><select name="categoria" class="ghost-input w-full px-3 py-2"><option>Popcorn</option><option>Bevande</option><option>Snack</option><option>Dolci</option></select></div>
                <div><label class="block text-sm mb-1">Prezzo €</label><input name="prezzo" type="number" step="0.01" required class="ghost-input w-full px-3 py-2" value="5.00"></div>
              </div>
              <div><label class="block text-sm mb-1">URL Immagine</label><input name="immagine" class="ghost-input w-full px-3 py-2" placeholder="https://..."></div>
              <div class="flex items-center gap-2"><input type="checkbox" name="attivo" checked class="w-4 h-4 rounded"><label class="text-sm">Attivo</label></div>
            </form>
          </div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button onclick="closeFoodModal()" class="btn-outline-brand px-4 py-2 rounded-lg text-sm">Annulla</button>
            <button onclick="saveFood()" class="btn-gold px-4 py-2 rounded-lg text-sm">Salva</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js?v=99"></script>
<script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
  <script src="/js/runtime-config.js"></script>
    <script src="/js/api-app.js?v=103"></script>
  <script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
  <script src="/js/admin-panel.js?v=6"></script>
  <script src="/js/admin-shell.js?v=100"></script>
  <script src="/js/staff-shell.js?v=1"></script>
  <script src="/js/pages/food-admin.js?v=1"></script>
</body>
</html>
