<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 — Gestione Premi</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans">
  <div id="navbar-container"></div>
  <main>
    <div class="p-6">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-brand-on-surface">Gestione Premi</h1>
        <button id="btn-nuovo-premio" class="btn-gold text-sm"><i class="fa-solid fa-plus mr-1"></i>Nuovo Premio</button>
      </div>
      <div id="premi-loading" class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-brand-gold"></i><p class="mt-2 text-brand-on-surface-variant">Caricamento premi...</p></div>
      <div id="premi-empty" class="hidden text-center py-12"><i class="fa-solid fa-gift text-5xl text-brand-gold mb-4"></i><h3 class="text-lg font-semibold text-brand-on-surface mb-2">Nessun premio</h3><p class="text-brand-on-surface-variant">Crea il primo premio per la membership.</p></div>
      <div id="premi-table-container" class="hidden overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-brand-outline-variant/20 text-left">
            <th class="pb-3 pr-4 text-brand-on-surface-variant font-medium">Nome</th>
            <th class="pb-3 pr-4 text-brand-on-surface-variant font-medium">Tipo</th>
            <th class="pb-3 pr-4 text-brand-on-surface-variant font-medium">Costo Punti</th>
            <th class="pb-3 pr-4 text-brand-on-surface-variant font-medium">Valore</th>
            <th class="pb-3 pr-4 text-brand-on-surface-variant font-medium">Disponibilità</th>
            <th class="pb-3 pr-4 text-brand-on-surface-variant font-medium">Stato</th>
            <th class="pb-3 text-brand-on-surface-variant font-medium">Azioni</th>
          </tr></thead>
          <tbody id="premi-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Nuovo/Modifica Premio -->
  <div id="premio-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop">
    <div class="bg-brand-surface-container-lowest rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] flex flex-col overflow-hidden animate-fade-in">
      <div class="flex items-center justify-between p-5 border-b border-brand-outline-variant/20">
        <h2 class="text-xl font-bold text-brand-on-surface" id="premio-modal-title">Nuovo Premio</h2>
        <button id="premio-modal-close" class="text-brand-on-surface-variant hover:text-brand-on-surface p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="premio-form" class="p-5 space-y-4 overflow-y-auto">
        <input type="hidden" id="premio-id">
        <div><label class="block text-xs text-brand-on-surface-variant mb-1">Nome *</label><input id="premio-nome" class="ghost-input w-full px-4 py-2.5 rounded-xl" required maxlength="150"></div>
        <div><label class="block text-xs text-brand-on-surface-variant mb-1">Descrizione</label><textarea id="premio-descrizione" rows="2" class="ghost-input w-full p-3 rounded-xl resize-none" maxlength="500"></textarea></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-brand-on-surface-variant mb-1">Tipo *</label>
            <select id="premio-tipo" class="ghost-input w-full px-4 py-2.5 rounded-xl">
              <option value="Sconto">Sconto</option>
              <option value="Biglietto">Biglietto</option>
              <option value="GiftCard">Gift Card</option>
              <option value="Merch">Merch</option>
              <option value="Food">Cibo/Bevanda</option>
            </select>
          </div>
          <div><label class="block text-xs text-brand-on-surface-variant mb-1">Costo Punti *</label><input id="premio-costo" type="number" min="1" class="ghost-input w-full px-4 py-2.5 rounded-xl" required></div>
        </div>
        <div id="premio-merch-container" class="hidden">
          <label class="block text-xs text-brand-on-surface-variant mb-1">Articolo Merch *</label>
          <select id="premio-merch-item" class="ghost-input w-full px-4 py-2.5 rounded-xl"></select>
        </div>
        <div id="sconto-opzioni" class="hidden p-3 rounded-xl bg-brand-surface-container mb-3 space-y-3">
          <p class="text-xs font-semibold text-brand-gold uppercase tracking-wider">Opzioni sconto</p>
          <div class="flex gap-3">
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="tipoSconto" value="fisso" checked class="text-brand-gold" onchange="toggleScontoTipo()"><span class="text-sm text-brand-on-surface">Importo fisso</span></label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="tipoSconto" value="percentuale" class="text-brand-gold" onchange="toggleScontoTipo()"><span class="text-sm text-brand-on-surface">Percentuale</span></label>
          </div>
          <div id="sconto-fisso"><label class="block text-xs text-brand-on-surface-variant mb-1">Importo sconto (€)</label><input id="sconto-valore" type="number" min="0" step="0.01" class="ghost-input w-full px-4 py-2 rounded-xl"></div>
          <div id="sconto-percentuale" class="hidden"><label class="block text-xs text-brand-on-surface-variant mb-1">Percentuale sconto (%)</label><input id="sconto-perc" type="number" min="0" max="100" class="ghost-input w-full px-4 py-2 rounded-xl"><label class="block text-xs text-brand-on-surface-variant mt-2 mb-1">Sconto massimo (€, opzionale)</label><input id="sconto-max" type="number" min="0" step="0.01" class="ghost-input w-full px-4 py-2 rounded-xl"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-brand-on-surface-variant mb-1">Valore (€)</label><input id="premio-valore" type="number" min="0" step="0.01" class="ghost-input w-full px-4 py-2.5 rounded-xl"></div>
          <div><label class="block text-xs text-brand-on-surface-variant mb-1">Quantità (-1 = illimitato)</label><input id="premio-qty" type="number" min="-1" value="-1" class="ghost-input w-full px-4 py-2.5 rounded-xl"></div>
        </div>
        <div class="flex items-center gap-2"><input type="checkbox" id="premio-attivo" checked class="rounded"><label for="premio-attivo" class="text-sm text-brand-on-surface">Attivo</label></div>
        <div id="premio-form-error" class="hidden text-sm text-red-500"></div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="premio-modal-cancel" class="btn-ghost text-sm px-5 py-2.5">Annulla</button>
          <button type="submit" class="btn-gold text-sm px-5 py-2.5"><i class="fa-solid fa-floppy-disk mr-1"></i>Salva</button>
        </div>
      </form>
    </div>
  </div>

  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>
  <script src="/js/utils.js?v=99"></script>
  <script src="/js/api-app.js?v=103"></script>
  <script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
  <script src="/js/admin-shell.js?v=101"></script>
  <script src="/js/template-loader.js?v=101"></script>
  <script src="/js/pages/premi-admin.js?v=1"></script>
</body>
</html>
