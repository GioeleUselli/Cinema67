<script>
(function() {
  const loginBtn = document.getElementById('login-btn');
  const registerBtn = document.getElementById('register-btn');
  const userDropdown = document.getElementById('user-dropdown');
  const userName = document.getElementById('user-name');
  const userMenuToggle = document.getElementById('user-menu-toggle');
  const userMenu = document.getElementById('user-menu');
  const logoutBtn = document.getElementById('logout-btn');
  const mobileAuthLinks = document.getElementById('mobile-auth-links');
  const mobileUserMenu = document.getElementById('mobile-user-menu');
  const mobileUserName = document.getElementById('mobile-user-name');
  const mobileLogoutBtn = document.getElementById('mobile-logout-btn');

  function normalizeRole(role) {
    if (role == null) return '';
    const value = String(role).trim().toLowerCase();
    if (value === '2' || value === 'admin') return 'admin';
    if (value === '1' || value === 'poweruser') return 'poweruser';
    if (value === '0' || value === 'user') return 'user';
    return value;
  }

  function updateAuthUI() {
    if (typeof Auth === 'undefined' || !Auth) {
      document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
      return;
    }

    const isLoggedIn = Auth.isLoggedIn();
    const role = normalizeRole(isLoggedIn ? (Auth.getUserRole() ?? null) : null);
    const isAdminOrPowerUser = role === 'admin' || role === 'poweruser';

    if (isLoggedIn && Auth.getUser()) {
      const user = Auth.getUser();
      if (loginBtn) loginBtn.classList.add('hidden');
      if (registerBtn) registerBtn.classList.add('hidden');
      if (userDropdown) {
        userDropdown.classList.remove('hidden');
        userName.textContent = user.nome || user.email || 'Utente';
      }
      if (mobileAuthLinks) mobileAuthLinks.classList.add('hidden');
      if (mobileUserMenu) {
        mobileUserMenu.classList.remove('hidden');
        mobileUserName.textContent = user.nome || user.email || 'Utente';
      }
    } else {
      if (loginBtn) loginBtn.classList.remove('hidden');
      if (registerBtn) registerBtn.classList.remove('hidden');
      if (userDropdown) userDropdown.classList.add('hidden');
      if (mobileAuthLinks) mobileAuthLinks.classList.remove('hidden');
      if (mobileUserMenu) mobileUserMenu.classList.add('hidden');
    }

    document.querySelectorAll('.admin-only').forEach(el => {
      if (isAdminOrPowerUser) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    });
  }

  function toggleUserMenu() {
    if (userMenu) userMenu.classList.toggle('hidden');
  }

  function handleLogout() {
    Auth?.logout().then(() => {
      window.location.href = '/index.html';
    }).catch(() => {
      window.location.href = '/index.html';
    });
  }

  if (userMenuToggle) {
    userMenuToggle.addEventListener('click', toggleUserMenu);
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', handleLogout);
  }

  if (mobileLogoutBtn) {
    mobileLogoutBtn.addEventListener('click', handleLogout);
  }

  document.addEventListener('click', (e) => {
    if (userMenuToggle && userMenu && !userMenuToggle.contains(e.target) && !userMenu.contains(e.target)) {
      userMenu.classList.add('hidden');
    }
  });

  window.updateAuthUI = updateAuthUI;

  function updateCinemaDisplay(cinemaName) {
    const desktopDisplay = document.getElementById('navbar-cinema-display');
    const desktopName = document.getElementById('navbar-selected-cinema');
    const mobileDisplay = document.getElementById('mobile-navbar-cinema-display');
    const mobileName = document.getElementById('mobile-navbar-selected-cinema');

    if (cinemaName) {
      if (desktopDisplay) desktopDisplay.classList.remove('hidden');
      if (desktopDisplay) desktopDisplay.classList.add('flex');
      if (desktopName) desktopName.textContent = cinemaName;
      if (mobileDisplay) mobileDisplay.classList.remove('hidden');
      if (mobileDisplay) mobileDisplay.classList.add('flex');
      if (mobileName) mobileName.textContent = cinemaName;
    } else {
      if (desktopDisplay) {
        desktopDisplay.classList.add('hidden');
        desktopDisplay.classList.remove('flex');
      }
      if (mobileDisplay) {
        mobileDisplay.classList.add('hidden');
        mobileDisplay.classList.remove('flex');
      }
    }
  }

  window.updateNavbarCinema = updateCinemaDisplay;

  if (typeof window.initializeNavbar === 'function') {
    const originalInitialize = window.initializeNavbar;
    window.initializeNavbar = function() {
      originalInitialize();
      updateAuthUI();
    };
  } else {
    window.initializeNavbar = updateAuthUI;
  }

  updateAuthUI();

  document.addEventListener('components:loaded', updateAuthUI);
  document.addEventListener('cinema:changed', (e) => {
    updateCinemaDisplay(e.detail?.cinemaName || null);
  });
})();
</script>
