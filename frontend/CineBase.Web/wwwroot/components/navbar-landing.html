<script>
(function() {
  var loginBtn = document.getElementById('login-btn');
  var registerBtn = document.getElementById('register-btn');
  var userDropdown = document.getElementById('user-dropdown');
  var userName = document.getElementById('user-name');
  var userMenuToggle = document.getElementById('user-menu-toggle');
  var userMenu = document.getElementById('user-menu');
  var logoutBtn = document.getElementById('logout-btn');
  var mobileAuthLinks = document.getElementById('mobile-auth-links');
  var mobileUserMenu = document.getElementById('mobile-user-menu');
  var mobileUserName = document.getElementById('mobile-user-name');
  var mobileLogoutBtn = document.getElementById('mobile-logout-btn');

  function applyAuthUI() {
    var hasToken = false;
    var displayName = 'Account';
    var admin = false;
    try {
      if (typeof Auth !== 'undefined' && Auth && typeof Auth.getAccessToken === 'function') {
        var token = Auth.getAccessToken();
        if (token && typeof Auth.isLoggedIn === 'function' && Auth.isLoggedIn()) {
          hasToken = true;
          try { var u = Auth.getUser(); displayName = (u && (u.nome || u.email)) || 'Account'; } catch (e) {}
          try { var r = String((Auth.getUserRole ? Auth.getUserRole() : '') || '').toLowerCase(); admin = r === 'admin' || r === 'poweruser'; } catch (e) {}
        }
      }
    } catch (e) {}

    function toggle(el, show) {
      if (!el) return;
      if (show) { el.classList.remove('hidden'); } else { el.classList.add('hidden'); }
    }

    toggle(loginBtn, !hasToken);
    toggle(registerBtn, !hasToken);
    toggle(mobileAuthLinks, !hasToken);
    toggle(userDropdown, hasToken);
    if (userName) userName.textContent = displayName;
    toggle(mobileUserMenu, hasToken);
    if (mobileUserName) mobileUserName.textContent = displayName;

    document.querySelectorAll('.admin-only').forEach(function (el) {
      toggle(el, admin);
    });

    var hl = document.getElementById('hero-login-btn');
    var hp = document.getElementById('hero-profile-btn');
    toggle(hl, !hasToken);
    toggle(hp, hasToken);
  }

  applyAuthUI();
  window.updateAuthUI = applyAuthUI;

  if (userMenuToggle) userMenuToggle.addEventListener('click', function () {
    if (userMenu) userMenu.classList.toggle('hidden');
  });

  function doLogout() {
    if (window.Auth && window.Auth.logout) {
      window.Auth.logout().finally(function () { window.location.href = '/index.html'; });
    } else {
      window.location.href = '/index.html';
    }
  }
  if (logoutBtn) logoutBtn.addEventListener('click', doLogout);
  if (mobileLogoutBtn) mobileLogoutBtn.addEventListener('click', doLogout);

  document.addEventListener('click', function (e) {
    if (userMenuToggle && userMenu && !userMenuToggle.contains(e.target) && !userMenu.contains(e.target)) {
      userMenu.classList.add('hidden');
    }
  });

  function updateCinemaDisplay(cinemaName) {
    var d1 = document.getElementById('navbar-cinema-display');
    var d2 = document.getElementById('navbar-selected-cinema');
    var m1 = document.getElementById('mobile-navbar-cinema-display');
    var m2 = document.getElementById('mobile-navbar-selected-cinema');
    if (cinemaName) {
      if (d1) { d1.classList.remove('hidden'); d1.classList.add('flex'); }
      if (d2) d2.textContent = cinemaName;
      if (m1) { m1.classList.remove('hidden'); m1.classList.add('flex'); }
      if (m2) m2.textContent = cinemaName;
    } else {
      if (d1) { d1.classList.add('hidden'); d1.classList.remove('flex'); }
      if (m1) { m1.classList.add('hidden'); m1.classList.remove('flex'); }
    }
  }

  window.updateNavbarCinema = updateCinemaDisplay;

  if (typeof window.initializeNavbar === 'function') {
    var orig = window.initializeNavbar;
    window.initializeNavbar = function () { orig(); };
  }

  document.addEventListener('cinema:changed', function (e) {
    updateCinemaDisplay(e.detail ? e.detail.cinemaName : null);
  });
})();
</script>
