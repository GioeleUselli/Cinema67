<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 — Feste Admin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js"></script>
  </head>
<body class="bg-brand-surface text-brand-on-surface font-sans cine-velvet">
  <main class="mx-auto w-full max-w-[1280px] px-4 py-8 sm:px-6 lg:px-8">
    <section class="cine-premium-card p-6 sm:p-8 relative overflow-hidden mb-8">
      <div class="absolute -top-24 -right-24 w-56 h-56 rounded-full bg-brand-gold/5 blur-3xl pointer-events-none"></div>
      <div class="relative">
        <p class="cine-kicker">Admin</p>
        <h1 class="cine-headline text-brand-on-surface mt-1">Prenotazioni Feste</h1>
      </div>
      <div class="flex gap-2 mt-3 flex-wrap">
        <button onclick="scanQr()" class="btn-outline-brand text-xs"><i class="fa-solid fa-qrcode mr-1"></i> Scansiona QR</button>
        <label class="flex items-center gap-2 cursor-pointer text-xs text-brand-on-surface-variant">
          <input type="checkbox" id="auto-toggle" class="w-4 h-4 rounded" onchange="toggleAuto(this.checked)">
          <span>Auto-Completa feste terminate</span>
        </label>
      </div>
    </section>
    <div class="cine-premium-card overflow-x-auto">
      <table class="min-w-full divide-y divide-brand-outline-variant/10">
        <thead class="bg-brand-surface-container/50">
          <tr>
            <th class="px-4 py-3 text-left label-caps">Festa</th>
            <th class="px-4 py-3 text-left label-caps">Utente</th>
            <th class="px-4 py-3 text-left label-caps">Cinema</th>
            <th class="px-4 py-3 text-left label-caps">Data/Ora</th>
            <th class="px-4 py-3 text-left label-caps">Tipo</th>
            <th class="px-4 py-3 text-left label-caps">Ospiti</th>
            <th class="px-4 py-3 text-left label-caps">Totale</th>
            <th class="px-4 py-3 text-left label-caps">Stato</th>
            <th class="px-4 py-3 text-left label-caps">Azioni</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-brand-outline-variant/10">
          <tr><td colspan="9" class="px-4 py-8 text-center">Caricamento...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="/js/utils.js?v=99"></script>
<script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
     <script src="/js/runtime-config.js"></script>
  <script src="/js/runtime-config.js"></script>
    <script src="/js/api-app.js?v=8"></script>
  <script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
  <script src="/js/admin-panel.js?v=6"></script>
  <script src="/js/admin-shell.js?v=100"></script>
  <script src="/js/staff-shell.js?v=1"></script>
  <script src="/js/pages/feste-admin.js?v=1"></script>
</body>
</html>
