<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema67 — Gestione Merch Shop</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=5" rel="stylesheet">
  <script src="/js/theme.js?v=99"></script>
  <style>
    .crop-container { position:relative; width:320px; height:320px; overflow:hidden; border-radius:16px; background:#000; touch-action:none; user-select:none; }
    .crop-image { position:absolute; pointer-events:none; }
    .crop-overlay { position:absolute; inset:0; border-radius:16px; box-shadow:0 0 0 9999px rgba(0,0,0,0.55); }
    .crop-drag-area { position:absolute; inset:0; cursor:grab; z-index:5; }
    .crop-drag-area:active { cursor:grabbing; }
  </style>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans cine-velvet min-h-screen">
<main>
  <div class="mb-8">
    <p class="text-xs uppercase tracking-[0.24em] text-brand-gold mb-1">Shop Cinema67</p>
    <h2 class="text-2xl font-bold text-brand-on-surface mb-4">Gestione Merchandise</h2>
    <div class="flex gap-3">
      <button id="tab-items-btn" onclick="showTab('items')" class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-gold/10 text-brand-gold border border-brand-gold/20 active-tab">Articoli</button>
      <button id="tab-orders-btn" onclick="showTab('orders')" class="px-4 py-2 rounded-xl text-sm font-semibold text-brand-on-surface-variant hover:text-brand-gold border border-transparent hover:border-brand-gold/20">Ordini</button>
      <button id="tab-new-item-btn" onclick="showTab('new-item')" class="px-4 py-2 rounded-xl text-sm font-semibold text-brand-on-surface-variant hover:text-brand-gold border border-transparent hover:border-brand-gold/20"><i class="fa-solid fa-plus mr-1"></i>Nuovo Articolo</button>
    </div>
  </div>
  <div id="tab-items" class="space-y-4"><div id="items-list" class="space-y-2"></div></div>
  <!-- Edit Item -->
  <div id="tab-edit-item" class="hidden">
    <div class="cine-premium-card p-6 max-w-lg">
      <h3 class="text-lg font-bold text-brand-on-surface mb-4" id="edit-item-title">Modifica Articolo</h3>
      <form id="edit-item-form" class="space-y-4">
        <input type="hidden" id="edit-item-id">
        <input type="hidden" id="edit-item-immagine" value="">
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Immagine principale</label>
          <div class="flex items-center gap-3">
            <div id="edit-img-preview" class="w-16 h-16 rounded-xl bg-brand-surface-dim flex items-center justify-center text-brand-gold text-2xl flex-shrink-0 overflow-hidden border-2 border-dashed border-brand-outline-variant/30"><i class="fa-solid fa-film"></i></div>
            <button type="button" onclick="openCropEditor('edit')" class="btn-outline-brand text-xs px-4 py-2"><i class="fa-solid fa-camera mr-1"></i>Scegli Immagine</button>
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Galleria immagini</label>
          <div id="edit-images-gallery" class="flex flex-wrap gap-2 mb-2"></div>
          <button type="button" onclick="addGalleryImage('edit')" class="btn-ghost text-xs px-3 py-1"><i class="fa-solid fa-plus mr-1"></i>Aggiungi</button>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Nome</label>
          <input type="text" id="edit-item-nome" required maxlength="150" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Descrizione</label>
          <textarea id="edit-item-descrizione" maxlength="500" rows="2" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Prezzo (€)</label><input type="number" id="edit-item-prezzo" required step="0.01" min="0.01" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20"></div>
          <div><label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Stock</label><input type="number" id="edit-item-stock" required min="0" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20"></div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Categoria</label>
          <select id="edit-item-categoria" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold">
            <option value="Abbigliamento">Abbigliamento</option><option value="Poster">Poster</option><option value="Gadget">Gadget</option><option value="Collezionabili">Collezionabili</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="edit-item-attivo" checked class="rounded border-brand-outline-variant/30 text-brand-gold focus:ring-brand-gold/20">
          <label class="text-sm text-brand-on-surface-variant">Articolo attivo</label>
        </div>
        <!-- Variants -->
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Varianti (colori / taglie)</label>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div><label class="text-[10px] text-brand-on-surface-variant">Colori</label>
              <textarea id="edit-variant-colors" rows="2" placeholder="Nero, Bianco, Rosso" class="w-full rounded-lg bg-brand-surface-container border border-brand-outline-variant/30 px-3 py-1.5 text-xs text-brand-on-surface focus:border-brand-gold"></textarea></div>
            <div><label class="text-[10px] text-brand-on-surface-variant">Taglie</label>
              <textarea id="edit-variant-sizes" rows="2" placeholder="S, M, L, XL" class="w-full rounded-lg bg-brand-surface-container border border-brand-outline-variant/30 px-3 py-1.5 text-xs text-brand-on-surface focus:border-brand-gold"></textarea></div>
          </div>
          <div class="flex items-center gap-3 mb-3">
            <button type="button" onclick="generateVariantMatrix('edit')" class="btn-outline-brand text-xs px-3 py-1.5"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Genera Combinazioni</button>
            <span class="text-[10px] text-brand-on-surface-variant">Stock default per tutte: <input type="number" id="edit-variant-default-stock" value="5" min="0" class="w-16 text-xs rounded-lg bg-brand-surface border border-brand-outline-variant/20 px-2 py-0.5 text-brand-on-surface inline-block"></span>
          </div>
          <div id="edit-variants-list" class="space-y-1 mb-2 max-h-64 overflow-y-auto"></div>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn-gold text-sm px-6 py-2">Salva</button>
          <button type="button" onclick="showTab('items')" class="btn-ghost text-sm px-6 py-2">Annulla</button>
        </div>
      </form>
    </div>
  </div>
  <!-- New Item -->
  <div id="tab-new-item" class="hidden">
    <div class="cine-premium-card p-6 max-w-lg">
      <h3 class="text-lg font-bold text-brand-on-surface mb-4">Nuovo Articolo</h3>
      <form id="new-item-form" class="space-y-4">
        <input type="hidden" id="new-item-immagine" value="">
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Immagine principale</label>
          <div class="flex items-center gap-3">
            <div id="new-img-preview" class="w-16 h-16 rounded-xl bg-brand-surface-dim flex items-center justify-center text-brand-gold text-2xl flex-shrink-0 overflow-hidden border-2 border-dashed border-brand-outline-variant/30"><i class="fa-solid fa-film"></i></div>
            <button type="button" onclick="openCropEditor('new')" class="btn-outline-brand text-xs px-4 py-2"><i class="fa-solid fa-camera mr-1"></i>Scegli Immagine</button>
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Galleria immagini</label>
          <div id="new-images-gallery" class="flex flex-wrap gap-2 mb-2"></div>
          <button type="button" onclick="addGalleryImage('new')" class="btn-ghost text-xs px-3 py-1"><i class="fa-solid fa-plus mr-1"></i>Aggiungi</button>
        </div>
        <input type="hidden" id="new-item-id" value="">
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Nome *</label>
          <input type="text" id="new-item-nome" required maxlength="150" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Descrizione</label>
          <textarea id="new-item-descrizione" maxlength="500" rows="2" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Prezzo (€) *</label><input type="number" id="new-item-prezzo" required step="0.01" min="0.01" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20"></div>
          <div><label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Stock</label><input type="number" id="new-item-stock" required min="0" value="10" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/20"></div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Categoria</label>
          <select id="new-item-categoria" class="w-full rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 px-4 py-2 text-sm text-brand-on-surface focus:border-brand-gold">
            <option value="Abbigliamento">Abbigliamento</option><option value="Poster">Poster</option><option value="Gadget">Gadget</option><option value="Collezionabili">Collezionabili</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="new-item-attivo" checked class="rounded border-brand-outline-variant/30 text-brand-gold focus:ring-brand-gold/20">
          <label class="text-sm text-brand-on-surface-variant">Articolo attivo</label>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-brand-on-surface-variant mb-1">Varianti (colori / taglie)</label>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div><label class="text-[10px] text-brand-on-surface-variant">Colori</label>
              <textarea id="new-variant-colors" rows="2" placeholder="Nero, Bianco, Rosso" class="w-full rounded-lg bg-brand-surface-container border border-brand-outline-variant/30 px-3 py-1.5 text-xs text-brand-on-surface focus:border-brand-gold"></textarea></div>
            <div><label class="text-[10px] text-brand-on-surface-variant">Taglie</label>
              <textarea id="new-variant-sizes" rows="2" placeholder="S, M, L, XL" class="w-full rounded-lg bg-brand-surface-container border border-brand-outline-variant/30 px-3 py-1.5 text-xs text-brand-on-surface focus:border-brand-gold"></textarea></div>
          </div>
          <div class="flex items-center gap-3 mb-3">
            <button type="button" onclick="generateVariantMatrix('new')" class="btn-outline-brand text-xs px-3 py-1.5"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Genera Combinazioni</button>
            <span class="text-[10px] text-brand-on-surface-variant">Stock default per tutte: <input type="number" id="new-variant-default-stock" value="5" min="0" class="w-16 text-xs rounded-lg bg-brand-surface border border-brand-outline-variant/20 px-2 py-0.5 text-brand-on-surface inline-block"></span>
          </div>
          <div id="new-variants-list" class="space-y-1 mb-2 max-h-64 overflow-y-auto"></div>
        </div>
        <button type="submit" class="btn-gold text-sm px-6 py-2">Crea Articolo</button>
      </form>
    </div>
  </div>
  <!-- Orders -->
  <div id="tab-orders" class="hidden space-y-4"><div id="orders-list" class="space-y-2"></div></div>
</main>

<!-- Crop Modal -->
<div id="crop-modal" class="hidden fixed inset-0 z-[999] flex items-center justify-center bg-black/80 p-4">
  <div class="cine-premium-card p-6 w-full max-w-md flex flex-col items-center gap-4">
    <div class="flex justify-between w-full"><h3 class="text-lg font-bold text-brand-on-surface">Ritaglia immagine</h3><button onclick="closeCropEditor()" class="text-brand-on-surface-variant hover:text-brand-red text-xl">&times;</button></div>
    <div class="crop-container" id="crop-container"><img id="crop-image" class="crop-image" src="" alt="" draggable="false" style="display:none"><div class="crop-drag-area" id="crop-drag-area"></div><div class="crop-overlay"></div></div>
    <div class="w-full flex items-center gap-3"><span class="text-xs text-brand-on-surface-variant">Zoom</span><input type="range" id="crop-zoom" min="0.5" max="3" step="0.01" value="1" class="flex-1 accent-brand-gold"><span class="text-xs text-brand-on-surface-variant" id="crop-zoom-val">100%</span></div>
    <div class="flex gap-3 w-full pt-2"><button onclick="closeCropEditor()" class="btn-ghost text-sm flex-1">Annulla</button><button onclick="confirmCrop()" class="btn-gold text-sm flex-1"><i class="fa-solid fa-check mr-1"></i>Conferma</button></div>
  </div>
</div>
<input type="file" id="crop-file-input" accept="image/jpeg,image/png,image/webp" style="display:none">
<input type="file" id="gallery-file-input" accept="image/jpeg,image/png,image/webp" style="display:none">

<script src="/js/auth.js?v=100"></script>
  <script src="/js/route-guard.js?v=103"></script>
<script src="/js/navbar.js?v=100"></script>
<script src="/js/admin-shell.js?v=103"></script>
  <script src="/js/staff-shell.js?v=1"></script>
<script src="/js/template-loader.js?v=101"></script>
<script src="/js/runtime-config.js"></script>
  <script src="/js/runtime-config.js"></script>
    <script src="/js/api-app.js?v=103"></script>
<script src="/js/pages/merch-admin.js?v=1"></script>
</body>
</html>
