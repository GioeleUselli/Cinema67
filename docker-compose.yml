version: '3.8'

# ============================================================================
# Docker Compose for CineBase Local Development
# ============================================================================
# Services:
#   - mariadb: Database (port 3306, internal)
#   - filmapi: Backend API (port 5000, internal)
#   - cinebase-web: Frontend (port 5001, external via nginx)
# 
# Networks: cinema67-network (bridge mode)
# Volumes: mariadb-data, filmapi-media, filmapi-dataprotection (persistence)
# 
# Startup:
#   docker-compose up -d
#   (wait 30s for services to be healthy)
#   curl http://localhost:5001  (frontend)
#   curl http://localhost:5000/api/films  (API)
# ============================================================================

services:
  # ══════════════════════════════════════════════════════════════════════
  # MariaDB Database
  # ══════════════════════════════════════════════════════════════════════
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema67-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # ══════════════════════════════════════════════════════════════════════
  # FilmAPI Backend
  # ══════════════════════════════════════════════════════════════════════
  filmapi:
    build:
      context: ./backend
      dockerfile: Dockerfile.filmapi
    container_name: filmapi
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Database configuration
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Application configuration
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:5000
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_DAYS: ${JWT_EXPIRES_IN_DAYS}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET}
      # External services
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      # Data protection
      DATA_PROTECTION_KEYS_PATH: ${DATA_PROTECTION_KEYS_PATH}
    volumes:
      - filmapi-media:/app/media
      - filmapi-dataprotection:/app/dataprotection
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - cinema67-network

  # ══════════════════════════════════════════════════════════════════════
  # CineBase Frontend (Nginx)
  # ══════════════════════════════════════════════════════════════════════
  cinebase-web:
    build:
      context: ./frontend
      dockerfile: CineBase.Web/Dockerfile
    container_name: cinebase-web
    restart: unless-stopped
    ports:
      - "5001:80"
    environment:
      # Backend upstream for nginx reverse proxy
      FILMAPI_UPSTREAM: filmapi:5000
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    depends_on:
      filmapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - cinema67-network

# ════════════════════════════════════════════════════════════════════════
# Named Volumes (Persistent Storage)
# ════════════════════════════════════════════════════════════════════════
volumes:
  # MariaDB data persistence
  mariadb-data:
    driver: local
    # Persist /var/lib/mysql data between container restarts
  
  # FilmAPI media uploads
  filmapi-media:
    driver: local
    # Persist /app/media between container restarts
  
  # FilmAPI Data Protection keys (shared across instances for session decryption)
  filmapi-dataprotection:
    driver: local
    # Persist /app/dataprotection keys for cookie encryption consistency

# ════════════════════════════════════════════════════════════════════════
# Networks
# ════════════════════════════════════════════════════════════════════════
networks:
  cinema67-network:
    driver: bridge
    # Internal bridge network for service-to-service communication
    # Services can reach each other by container name (DNS resolution)
