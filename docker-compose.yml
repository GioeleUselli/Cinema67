# ============================================================================
# Docker Compose for Cinema67 Local Development
# ============================================================================
# Services:
#   - mariadb: Database (internal, port 3306, no host exposure)
#   - filmapi: Backend API (port 5000:8080, external)
#   - cinema67-web: Frontend (port 5001:8080, external)
#   - mailpit: Email catcher (port 8025:8025 UI)
#
# Networks: cinema67-network (bridge mode)
# Volumes: mariadb-data, media-uploads
#
# Startup:
#   docker compose up -d --build
#   (wait 30s for services to be healthy)
#   curl http://localhost:5001  (frontend)
#   curl http://localhost:5000/api/films  (API)
# ============================================================================

services:
  # ══════════════════════════════════════════════════════════════════════
  # MariaDB Database
  # ══════════════════════════════════════════════════════════════════════
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"  # Different host port to avoid conflicts with local MariaDB
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-film-api-db}
      MARIADB_USER: ${DB_USER:-cinebase}
      MARIADB_PASSWORD: ${DB_PASSWORD:-cinebase}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema67-network

  # ══════════════════════════════════════════════════════════════════════
  # FilmAPI Backend
  # ══════════════════════════════════════════════════════════════════════
  filmapi:
    build:
      context: .
      dockerfile: backend/Dockerfile.filmapi
    container_name: filmapi
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      # Database
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-film-api-db}
      DB_USER: ${DB_USER:-cinebase}
      DB_PASSWORD: ${DB_PASSWORD:-cinebase}
      DB_USE_AUTODETECT: "false"
      DB_SERVER_VERSION: ${DB_SERVER_VERSION:-10.11.0-mariadb}
      # Application
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      FRONTEND_PUBLIC_BASE_URL: ${FRONTEND_PUBLIC_BASE_URL:-http://localhost:5001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5001,http://127.0.0.1:5001}
      # Authentication
      JWT_SECRET: ${JWT_SECRET:-SuperSecretKeyForCinema67JWTAuth2026!}
      JWT_EXPIRES_IN_DAYS: ${JWT_EXPIRES_IN_DAYS:-7}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@cinema67.it}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Admin123!}
      # Optional integrations (no default)
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      # External services
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_REQUIRE_AUTH: ${SMTP_REQUIRE_AUTH:-false}
      SMTP_SECURE_SOCKET_OPTIONS: ${SMTP_SECURE_SOCKET_OPTIONS:-None}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_BEARER_TOKEN: ${TMDB_BEARER_TOKEN:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - media-uploads:/app/wwwroot/media/covers
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - cinema67-network

  # ══════════════════════════════════════════════════════════════════════
  # Cinema67 Frontend
  # ══════════════════════════════════════════════════════════════════════
  cinema67-web:
    build:
      context: .
      dockerfile: frontend/CineBase.Web/Dockerfile
    container_name: cinema67-web
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:5000}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-development}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      filmapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - cinema67-network

  # ══════════════════════════════════════════════════════════════════════
  # Mailpit (Email Catcher)
  # ══════════════════════════════════════════════════════════════════════
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
    networks:
      - cinema67-network

# ════════════════════════════════════════════════════════════════════════
# Named Volumes (Persistent Storage)
# ════════════════════════════════════════════════════════════════════════
volumes:
  mariadb-data:
    driver: local
  media-uploads:
    driver: local

# ════════════════════════════════════════════════════════════════════════
# Networks
# ════════════════════════════════════════════════════════════════════════
networks:
  cinema67-network:
    driver: bridge
